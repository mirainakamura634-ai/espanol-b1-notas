<html lang="ja">

<body>
<title>B1読解 単語カード</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one centered study column (same look as the notes page, DESIGN.md = Mintlify): mode tabs, filters, then one big card. Spanish in green, Japanese in ink. */
:root {
  --canvas: #ffffff;
  --surface: #f7f7f7;
  --hairline: #e5e5e5;
  --ink: #0a0a0a;
  --text: #2a2a2c;
  --steel: #5a5a5c;
  --stone: #888888;
  --green: #00b48a;
  --es: #08755b;
  --es-mark: #d5f6ec;
  --ok: #1ba673;
  --ok-bg: #e3f6ee;
  --ng: #d45656;
  --ng-bg: #fbeaea;
  --shadow: rgba(10, 10, 10, 0.08);
  --font: "Inter", "Noto Sans JP", "Yu Gothic UI", "Hiragino Sans", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0d0e0e; --surface: #1a1b1c; --hairline: #2b2c2e; --ink: #ffffff; --text: #dcdcde;
    --steel: #b0b0b3; --stone: #8a8a8d; --green: #00d4a4; --es: #7cebcb; --es-mark: #12453a;
    --ok: #4fd3a0; --ok-bg: #123a2c; --ng: #f08a8a; --ng-bg: #3d1d1d; --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0d0e0e; --surface: #1a1b1c; --hairline: #2b2c2e; --ink: #ffffff; --text: #dcdcde;
  --steel: #b0b0b3; --stone: #8a8a8d; --green: #00d4a4; --es: #7cebcb; --es-mark: #12453a;
  --ok: #4fd3a0; --ok-bg: #123a2c; --ng: #f08a8a; --ng-bg: #3d1d1d; --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--canvas); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.7; margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.wrap {
  max-width: 44rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 18px;
}
h1 { margin: 0; font-size: 28px; line-height: 1.3; color: var(--ink); font-weight: 700; display: flex; align-items: center; gap: 10px; text-wrap: balance; }
h1::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--green); flex: none; }
.back { display: inline-block; margin-bottom: 12px; padding: 6px 14px; border: 1px solid var(--hairline); border-radius: 9999px; color: var(--ink); text-decoration: none; font-size: 14px; }
.back:hover { background: var(--surface); }
.sub { margin: 4px 0 0; color: var(--steel); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 9999px; width: fit-content; max-width: 100%; }
.tabs button { border: 0; background: none; padding: 7px 16px; border-radius: 9999px; cursor: pointer; font-size: 14px; color: var(--steel); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--canvas); font-weight: 600; }
.chip { border: 1px solid var(--hairline); background: var(--canvas); padding: 5px 12px; border-radius: 9999px; cursor: pointer; font-size: 13px; color: var(--steel); }
.chip[aria-pressed="true"] { border-color: var(--es); color: var(--es); background: var(--es-mark); font-weight: 600; }
.chip .n { font-variant-numeric: tabular-nums; opacity: 0.75; margin-left: 4px; }
.progress { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--steel); }
.bar { flex: 1; height: 6px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 9999px; overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--green); width: 0; transition: width 0.3s; }
.nums { font-variant-numeric: tabular-nums; white-space: nowrap; }
.link { background: none; border: 0; padding: 0; color: var(--steel); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.link.warn { color: var(--ng); }
.pill { border: 1px solid var(--hairline); background: var(--canvas); padding: 9px 18px; border-radius: 9999px; cursor: pointer; font-size: 14px; color: var(--ink); }
.pill:hover { background: var(--surface); }
.pill.primary { background: var(--ink); border-color: var(--ink); color: var(--canvas); font-weight: 600; }
.pill.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.pill.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); font-weight: 600; }
.pill:disabled { opacity: 0.4; cursor: default; }

/* card */
.card {
  width: 100%; min-height: 300px; border: 1px solid var(--hairline); border-radius: 16px; background: var(--canvas);
  box-shadow: 0 8px 28px var(--shadow); padding: 28px 24px; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 14px;
}
.card:hover { border-color: var(--stone); }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--stone); font-weight: 600; letter-spacing: 0.04em; }
.term { font-size: 32px; line-height: 1.3; font-weight: 700; color: var(--ink); text-wrap: balance; overflow-wrap: anywhere; }
.term.es { color: var(--es); }
.hint { margin-top: auto; font-size: 13px; color: var(--stone); }
.answer { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--hairline); padding-top: 14px; }
.ans-main { font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.4; overflow-wrap: anywhere; }
.ans-main.es { color: var(--es); }
.rel { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 14px; }
.rel dt { color: var(--stone); font-weight: 600; }
.rel dd { margin: 0; color: var(--es); min-width: 0; }
.ex { background: var(--surface); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.6; }
.ex .es { color: var(--es); font-weight: 500; display: block; }
.ex .ja { color: var(--steel); display: block; }
.controls { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.controls .row { gap: 8px; }
.keys { font-size: 12px; color: var(--stone); }
kbd { font-family: ui-monospace, Consolas, monospace; font-size: 11px; border: 1px solid var(--hairline); border-radius: 4px; padding: 0 5px; background: var(--surface); }
.done { text-align: center; padding: 40px 16px; border: 1px dashed var(--hairline); border-radius: 16px; color: var(--steel); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.done strong { font-size: 20px; color: var(--ink); }

/* quiz */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { border: 1px solid var(--hairline); background: var(--canvas); border-radius: 12px; padding: 14px 16px; cursor: pointer; text-align: left; font-size: 16px; line-height: 1.5; min-width: 0; overflow-wrap: anywhere; }
.choice:hover:not(:disabled) { border-color: var(--stone); background: var(--surface); }
.choice.es { color: var(--es); font-weight: 500; }
.choice.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.choice.wrong { border-color: var(--ng); background: var(--ng-bg); color: var(--ng); }
.choice:disabled { cursor: default; }
.feedback { font-weight: 700; min-height: 1.7em; }
.feedback.ok { color: var(--ok); }
.feedback.ng { color: var(--ng); }

/* list */
.search { width: 100%; height: 40px; padding: 0 14px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--surface); }
.table-wrap { overflow-x: auto; border: 1px solid var(--hairline); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.55; }
th, td { padding: 9px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--hairline); }
th { background: var(--surface); color: var(--steel); font-size: 12px; font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.es { color: var(--es); font-weight: 500; min-width: 9em; }
td.rel2 { color: var(--steel); font-size: 13px; min-width: 9em; }
td.st { white-space: nowrap; font-size: 12px; }
.tag { display: inline-block; padding: 0 8px; border-radius: 9999px; font-weight: 600; font-size: 11.5px; line-height: 1.8; }
.tag.k { background: var(--ok-bg); color: var(--ok); }
.tag.a { background: var(--ng-bg); color: var(--ng); }
.empty { color: var(--steel); padding: 16px; }

@media (max-width: 560px) {
  h1 { font-size: 22px; }
  .term { font-size: 26px; }
  .choices { grid-template-columns: 1fr; }
  .keys { display: none; }
  .card { padding: 22px 18px; min-height: 260px; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <a class="back" href="https://mirainakamura634-ai.github.io/espanol-b1-notas/">← ノートにもどる</a>
    <h1>B1読解 単語カード</h1>

  <div class="row" id="filters" aria-label="しぼりこみ"></div>

  <div class="progress">

  <section id="v-list" hidden>

        <tbody id="list-body"></tbody>
      </table>
    </div>
  </section>
</div>

  var cards = D.map(function (r, i) {
    return { id: r[1], cat: r[0], es: r[1], ja: r[2], syn: r[3], ant: r[4], ex: r[5], exja: r[6] };
  });

  var KEY = 'b1-cards-v1';
  var known = {};
  try { known = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { known = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(known)); } catch (e) {} }

  var state = { mode: 'card', dir: 'es', filter: 'all', deck: [], pos: 0, flipped: false, quiz: null, score: { ok: 0, all: 0 } };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pool() {
    return cards.filter(function (c) {
      if (state.filter === 'all') return true;
      if (state.filter === 'again') return known[c.id] !== 'k';
      return c.cat === state.filter;
    });
  }
  // まだ覚えていないカードを先に、その中はシャッフル
  function buildDeck() {
    var p = pool();
    var notYet = shuffle(p.filter(function (c) { return known[c.id] !== 'k'; }));
    var done = shuffle(p.filter(function (c) { return known[c.id] === 'k'; }));
    state.deck = notYet.concat(done); state.pos = 0; state.flipped = false;
  }

  /* ---------- filters & progress ---------- */
  function renderFilters() {
    var box = $('filters'); box.innerHTML = '';
    var opts = [['all', 'すべて']].concat(Object.keys(CATS).map(function (k) { return [k, CATS[k]]; })).concat([['again', 'まだ覚えていない']]);
    opts.forEach(function (o) {
      var n = cards.filter(function (c) { return o[0] === 'all' || (o[0] === 'again' ? known[c.id] !== 'k' : c.cat === o[0]); }).length;
      var b = el('button', 'chip', o[1]); b.type = 'button'; b.id = 'f-' + o[0];
      b.setAttribute('aria-pressed', state.filter === o[0] ? 'true' : 'false');
      b.appendChild(el('span', 'n', n));
      b.addEventListener('click', function () { state.filter = o[0]; buildDeck(); renderAll(); });
      box.appendChild(b);
    });
  }
  function renderProgress() {
    var k = cards.filter(function (c) { return known[c.id] === 'k'; }).length;
    $('known-count').textContent = '覚えた ' + k + ' / ' + cards.length + '語';
    $('bar').style.width = (k / cards.length * 100) + '%';
  }
  var resetArmed = false;
  $('reset').addEventListener('click', function () {
    var b = $('reset');
    if (!resetArmed) { resetArmed = true; b.textContent = 'もう一度押すと、記録を全部消します'; b.classList.add('warn'); setTimeout(function () { resetArmed = false; b.textContent = '覚えた記録をリセット'; b.classList.remove('warn'); }, 4000); return; }
    known = {}; save(); resetArmed = false; b.textContent = '覚えた記録をリセット'; b.classList.remove('warn');
    buildDeck(); renderAll();
  });

  /* ---------- card mode ---------- */
  function front(c) { return state.dir === 'es' ? c.es : c.ja; }
  function back(c) { return state.dir === 'es' ? c.ja : c.es; }
  function renderCard() {
    var v = $('v-card'); v.innerHTML = '';
    if (!state.deck.length) { v.appendChild(doneBox('このしぼりこみには、カードがありません。', false)); return; }
    if (state.pos >= state.deck.length) { v.appendChild(doneBox('ひと回り終わりました！', true)); return; }
    var c = state.deck[state.pos];
    var card = el('button', 'card'); card.type = 'button'; card.id = 'the-card';
    card.setAttribute('aria-label', state.flipped ? 'カード（答えを表示中）' : 'カード。押すと答えが出ます');
    var meta = el('div', 'meta');
    meta.appendChild(el('span', null, CATS[c.cat]));
    meta.appendChild(el('span', null, (state.pos + 1) + ' / ' + state.deck.length + (known[c.id] === 'k' ? '　✓ 覚えた' : '')));
    card.appendChild(meta);
    card.appendChild(el('div', 'term' + (state.dir === 'es' ? ' es' : ''), front(c)));
    if (state.flipped) {
      var a = el('div', 'answer');
      a.appendChild(el('div', 'ans-main' + (state.dir === 'ja' ? ' es' : ''), back(c)));
      if (c.syn || c.ant) {
        var dl = el('dl', 'rel'); dl.style.margin = '0';
        if (c.syn) { dl.appendChild(el('dt', null, '類義語')); dl.appendChild(el('dd', null, c.syn)); }
        if (c.ant) { dl.appendChild(el('dt', null, '反対語')); dl.appendChild(el('dd', null, c.ant)); }
        a.appendChild(dl);
      }
      if (c.ex) { var ex = el('div', 'ex'); ex.appendChild(el('span', 'es', c.ex)); ex.appendChild(el('span', 'ja', c.exja)); a.appendChild(ex); }
      card.appendChild(a);
    } else {
      card.appendChild(el('div', 'hint', '押すと答えが出ます'));
    }
    card.addEventListener('click', function () { state.flipped = !state.flipped; renderCard(); var n = $('the-card'); if (n) n.focus(); });
    v.appendChild(card);

    var ctr = el('div', 'controls'); ctr.style.marginTop = '14px';
    var left = el('div', 'row');
    var prev = el('button', 'pill', '← 前'); prev.type = 'button'; prev.disabled = state.pos === 0;
    prev.addEventListener('click', function () { move(-1); });
    left.appendChild(prev);
    var right = el('div', 'row');
    var again = el('button', 'pill ng', 'まだ'); again.type = 'button'; again.id = 'btn-again';
    again.addEventListener('click', function () { mark('a'); });
    var ok = el('button', 'pill ok', '覚えた'); ok.type = 'button'; ok.id = 'btn-ok';
    ok.addEventListener('click', function () { mark('k'); });
    right.appendChild(again); right.appendChild(ok);
    ctr.appendChild(left);
    var keys = el('span', 'keys'); keys.innerHTML = '<kbd>Space</kbd> 答え　<kbd>1</kbd> まだ　<kbd>2</kbd> 覚えた　<kbd>←</kbd><kbd>→</kbd> 移動';
    ctr.appendChild(keys);
    ctr.appendChild(right);
    v.appendChild(ctr);
  }
  function doneBox(msg, again) {
    var d = el('div', 'done'); d.appendChild(el('strong', null, msg));
    var k = state.deck.filter(function (c) { return known[c.id] === 'k'; }).length;
    if (state.deck.length) d.appendChild(el('span', null, 'このしぼりこみで覚えたのは ' + k + ' / ' + state.deck.length + '語です。'));
    if (again) {
      var row = el('div', 'row'); row.style.justifyContent = 'center';
      var b1 = el('button', 'pill primary', '「まだ」のカードだけもう一度'); b1.type = 'button';
      b1.addEventListener('click', function () { state.filter = 'again'; buildDeck(); renderAll(); });
      var b2 = el('button', 'pill', '最初からもう一度'); b2.type = 'button';
      b2.addEventListener('click', function () { buildDeck(); renderAll(); });
      row.appendChild(b1); row.appendChild(b2); d.appendChild(row);
    }
    return d;
  }
  function move(n) { state.pos = Math.max(0, Math.min(state.deck.length, state.pos + n)); state.flipped = false; renderCard(); }
  function mark(v) {
    var c = state.deck[state.pos]; if (!c) return;
    known[c.id] = v; save(); renderProgress(); renderFilters();
    move(1);
  }

  /* ---------- quiz mode ---------- */
  function newQuestion() {
    var p = pool(); if (!p.length) { state.quiz = null; return; }
    var weighted = p.filter(function (c) { return known[c.id] !== 'k'; });
    var src = weighted.length && Math.random() < 0.75 ? weighted : p;
    var q = src[Math.floor(Math.random() * src.length)];
    var same = cards.filter(function (c) { return c.cat === q.cat && c !== q && back(c) !== back(q); });
    var others = shuffle(same.length >= 3 ? same : cards.filter(function (c) { return c !== q && back(c) !== back(q); })).slice(0, 3);
    state.quiz = { q: q, choices: shuffle([q].concat(others)), answered: null };
  }
  function renderQuiz() {
    var v = $('v-quiz'); v.innerHTML = '';
    if (!state.quiz) newQuestion();
    if (!state.quiz) { v.appendChild(doneBox('このしぼりこみには、問題がありません。', false)); return; }
    var z = state.quiz, q = z.q;
    var card = el('div', 'card'); card.style.cursor = 'default';
    var meta = el('div', 'meta');
    meta.appendChild(el('span', null, CATS[q.cat]));
    meta.appendChild(el('span', null, '正解 ' + state.score.ok + ' / ' + state.score.all));
    card.appendChild(meta);
    card.appendChild(el('div', 'term' + (state.dir === 'es' ? ' es' : ''), front(q)));
    card.appendChild(el('div', 'sub', state.dir === 'es' ? '意味はどれ？' : 'スペイン語はどれ？'));
    var grid = el('div', 'choices');
    z.choices.forEach(function (c, i) {
      var b = el('button', 'choice' + (state.dir === 'ja' ? ' es' : ''), (i + 1) + '. ' + back(c)); b.type = 'button'; b.id = 'choice-' + i;
      if (z.answered) {
        b.disabled = true;
        if (c === q) b.classList.add('right');
        else if (c === z.answered) b.classList.add('wrong');
      }
      b.addEventListener('click', function () { answer(c); });
      grid.appendChild(b);
    });
    card.appendChild(grid);
    var fb = el('div', 'feedback');
    if (z.answered) {
      var right = z.answered === q;
      fb.classList.add(right ? 'ok' : 'ng');
      fb.textContent = right ? '正解！' : 'ざんねん。正しい答えは「' + back(q) + '」';
      card.appendChild(fb);
      var ex = el('div', 'ex');
      ex.appendChild(el('span', 'es', q.es + (q.syn ? '　（類：' + q.syn + '）' : '') + (q.ant ? '　（反：' + q.ant + '）' : '')));
      if (q.ex) { ex.appendChild(el('span', 'es', q.ex)); ex.appendChild(el('span', 'ja', q.exja)); }
      card.appendChild(ex);
      var next = el('button', 'pill primary', '次の問題 →'); next.type = 'button'; next.id = 'quiz-next';
      next.style.alignSelf = 'flex-end';
      next.addEventListener('click', function () { state.quiz = null; renderQuiz(); var n = $('choice-0'); if (n) n.focus(); });
      card.appendChild(next);
    } else {
      card.appendChild(fb);
    }
    v.appendChild(card);
  }
  function answer(c) {
    var z = state.quiz; if (!z || z.answered) return;
    z.answered = c; state.score.all++;
    if (c === z.q) state.score.ok++;
    else { known[z.q.id] = 'a'; save(); renderProgress(); renderFilters(); }
    renderQuiz();
    var n = $('quiz-next'); if (n) n.focus();
  }

  /* ---------- list mode ---------- */
  function fold(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function renderList() {
    var terms = fold($('list-q').value).split(/\s+/).filter(Boolean);
    var tb = $('list-body'); tb.innerHTML = '';
    var rows = pool().slice().sort(function (a, b) { return fold(a.es.replace(/^(el|la|los|las) /, '')).localeCompare(fold(b.es.replace(/^(el|la|los|las) /, '')), 'es'); });
    rows.forEach(function (c) {
      var hay = fold([c.es, c.ja, c.syn, c.ant].join(' '));
      if (!terms.every(function (t) { return hay.indexOf(t) !== -1; })) return;
      var tr = el('tr');
      tr.appendChild(el('td', 'es', c.es));
      tr.appendChild(el('td', null, c.ja));
      tr.appendChild(el('td', 'rel2', [c.syn ? '類 ' + c.syn : '', c.ant ? '反 ' + c.ant : ''].filter(Boolean).join('　') || '—'));
      var st = el('td', 'st');
      if (known[c.id] === 'k') st.appendChild(el('span', 'tag k', '覚えた'));
      else if (known[c.id] === 'a') st.appendChild(el('span', 'tag a', 'まだ'));
      else st.textContent = '—';
      tr.appendChild(st); tb.appendChild(tr);
    });
    if (!tb.children.length) { var tr = el('tr'), td = el('td', 'empty', '見つかりませんでした。'); td.colSpan = 4; tr.appendChild(td); tb.appendChild(tr); }
  }
  $('list-q').addEventListener('input', renderList);

  /* ---------- tabs ---------- */
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.addEventListener('click', function () { state.mode = b.dataset.mode; renderAll(); });
  });
  document.querySelectorAll('[data-dir]').forEach(function (b) {
    b.addEventListener('click', function () { state.dir = b.dataset.dir; state.flipped = false; state.quiz = null; renderAll(); });
  });
  function renderAll() {
    document.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.mode === state.mode ? 'true' : 'false'); });
    document.querySelectorAll('[data-dir]').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.dir === state.dir ? 'true' : 'false'); });
    $('v-card').hidden = state.mode !== 'card';
    $('v-quiz').hidden = state.mode !== 'quiz';
    $('v-list').hidden = state.mode !== 'list';
    renderFilters(); renderProgress();
    if (state.mode === 'card') renderCard();
    else if (state.mode === 'quiz') { state.quiz = null; renderQuiz(); }
    else renderList();
  }
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (state.mode === 'card') {
      if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.id !== 'the-card') return; e.preventDefault(); state.flipped = !state.flipped; renderCard(); }
      else if (e.key === 'ArrowRight') move(1);
      else if (e.key === 'ArrowLeft') move(-1);
      else if (e.key === '1') mark('a');
      else if (e.key === '2') mark('k');
    } else if (state.mode === 'quiz' && state.quiz && !state.quiz.answered && /^[1-4]$/.test(e.key)) {
      answer(state.quiz.choices[Number(e.key) - 1]);
    }
  });

  buildDeck();
  renderAll();
})();
