# 線過去（imperfecto）と点過去（indefinido）

> 授業で先生の説明とちがうところがあったら、**先生の説明を優先**してください。
> 「⚠」がついているところは、場面によって答えが変わることがある部分です。

## もくじ

1. ステップ1：点過去の活用
2. ステップ2：線過去の活用
3. ステップ3：使い分けの基本
4. ステップ4：日本語話者がまちがえやすい点
5. ステップ5：意味が変わる動詞
6. 練習問題（答えと解説は最後）

---

## ステップ1：点過去（indefinido）の活用

### 規則動詞

| | hablar（話す） | comer（食べる） | vivir（住む） |
|---|---|---|---|
| yo | habl**é** | com**í** | viv**í** |
| tú | habl**aste** | com**iste** | viv**iste** |
| él / ella / usted | habl**ó** | com**ió** | viv**ió** |
| nosotros | habl**amos** | com**imos** | viv**imos** |
| vosotros | habl**asteis** | com**isteis** | viv**isteis** |
| ellos / ustedes | habl**aron** | com**ieron** | viv**ieron** |

- -er と -ir は**同じ語尾**です。
- **アクセント記号が大事！** hablo（私は話す・現在）と habló（彼は話した・過去）はちがう意味です。

### よく使う不規則動詞（これだけは覚える）

| 原形 | yo | él / ella | ellos | 意味 |
|---|---|---|---|---|
| ser / ir | fui | fue | fueron | だった／行った（**同じ形！**） |
| estar | estuve | estuvo | estuvieron | いた |
| tener | tuve | tuvo | tuvieron | 持っていた |
| hacer | hice | **hizo** | hicieron | した |
| poder | pude | pudo | pudieron | できた |
| poner | puse | puso | pusieron | 置いた |
| saber | supe | supo | supieron | 知った |
| querer | quise | quiso | quisieron | 〜しようとした |
| venir | vine | vino | vinieron | 来た |
| decir | dije | dijo | **dijeron** | 言った |
| traer | traje | trajo | **trajeron** | 持ってきた |
| dar | di | dio | dieron | あげた |
| ver | vi | vio | vieron | 見た |

- 不規則動詞の yo / él の形には**アクセント記号がつきません**（tuve, tuvo）。
- decir・traer の ellos は **-eron**（× dijieron → ○ dijeron）。

### 3人称だけ変わる動詞

| 原形 | él / ella | ellos | ポイント |
|---|---|---|---|
| pedir（頼む） | p**i**dió | p**i**dieron | e → i |
| sentir（感じる） | s**i**ntió | s**i**ntieron | e → i |
| dormir（眠る） | d**u**rmió | d**u**rmieron | o → u |
| leer（読む） | le**y**ó | le**y**eron | i → y |
| oír（聞こえる） | o**y**ó | o**y**eron | i → y |

### yo だけつづりが変わる動詞

- llegar → lle**gué**　/　buscar → bus**qué**　/　empezar → empe**cé**
  （発音を保つためにつづりが変わるだけです）

---

## ステップ2：線過去（imperfecto）の活用

### 規則動詞

| | hablar | comer | vivir |
|---|---|---|---|
| yo | habl**aba** | com**ía** | viv**ía** |
| tú | habl**abas** | com**ías** | viv**ías** |
| él / ella / usted | habl**aba** | com**ía** | viv**ía** |
| nosotros | habl**ábamos** | com**íamos** | viv**íamos** |
| vosotros | habl**abais** | com**íais** | viv**íais** |
| ellos / ustedes | habl**aban** | com**ían** | viv**ían** |

### 不規則動詞は3つだけ！

| | ser（〜だった） | ir（行っていた） | ver（見ていた） |
|---|---|---|---|
| yo | era | iba | veía |
| tú | eras | ibas | veías |
| él / ella | era | iba | veía |
| nosotros | éramos | íbamos | veíamos |
| vosotros | erais | ibais | veíais |
| ellos | eran | iban | veían |

- **yo と él の形が同じ**です（yo vivía / él vivía）。わかりにくいときは主語をつけます。

---

## ステップ3：使い分けの基本

### イメージ：映画のワンシーン

- **線過去 ＝ 背景・舞台セット**（どんな状況だったか）
- **点過去 ＝ ストーリーが進むできごと**（何が起きたか）

> *Hacía sol y yo caminaba por el parque. De repente, **vi** a mi profesora.*
> 晴れていて、私は公園を歩いていた。（← 背景＝線過去）
> 突然、先生を見かけた。（← できごと＝点過去）

### 使い分け表

| 線過去（imperfecto） | 点過去（indefinido） |
|---|---|
| **背景・状況**<br>*Llovía mucho.*（雨がたくさん降っていた） | **起きたこと**<br>*Empezó a llover.*（雨が降り出した） |
| **描写（人・物・場所）**<br>*Mi abuela era muy simpática.*（祖母はとても感じがよかった） | **始まりと終わりがあること**<br>*Viví en Osaka cinco años.*（大阪に5年住んだ） |
| **昔の習慣（いつも〜していた）**<br>*De pequeña, iba a la playa todos los veranos.*（小さいころ、毎年夏は海に行っていた） | **1回のできごと**<br>*El verano pasado fui a la playa.*（去年の夏、海に行った） |
| **時刻・年齢**<br>*Eran las diez. Tenía 8 años.*（10時だった。8歳だった） | **できごとの連続**<br>*Me levanté, desayuné y salí.*（起きて、朝ごはんを食べて、出かけた） |
| **進行中の動作（〜している途中だった）**<br>*Mientras cocinaba, ...*（料理している間に…） | **途中に割りこんだこと**<br>*... sonó el teléfono.*（…電話が鳴った） |

### 目印になる言葉（ヒントであって、絶対ではありません ⚠）

- 線過去といっしょに使いやすい：*siempre*（いつも）、*todos los días*（毎日）、*normalmente*（ふつうは）、*antes*（以前は）、*de pequeño/a*（子どものころ）、*mientras*（〜の間）
- 点過去といっしょに使いやすい：*ayer*（昨日）、*el año pasado*（去年）、*una vez*（一度）、*de repente*（突然）、*en 2020*（2020年に）、*durante dos años*（2年間）

### よくある組み合わせ

> **線過去 ＋ cuando ＋ 点過去**
> *Dormía cuando llegaste.*（あなたが着いたとき、私は寝ていた）
>
> **Cuando ＋ 線過去（年齢など）, 点過去**
> *Cuando tenía 15 años, fui a España por primera vez.*（15歳のとき、初めてスペインに行った）

### おまけ：ていねいな線過去

お店などで *Quería un café, por favor.*（コーヒーをお願いしたいのですが）のように、**ていねいに頼むとき**にも線過去を使います。これは「過去」の意味ではありません。

---

## ステップ4：日本語話者がまちがえやすい点

### ① 「〜た」＝点過去、「〜ていた」＝線過去、ではない！

日本語の形で決めると、よくまちがえます。

| 日本語 | × まちがい | ○ 正しい | 理由 |
|---|---|---|---|
| 東京に10年**住んでいた** | ~~Vivía en Tokio diez años.~~ | *Viví en Tokio diez años.* | 「10年」と期間が区切られている → 点過去 |
| 昨日は一日中家に**いた** | ~~Estaba en casa todo el día.~~ ⚠ | *Ayer estuve en casa todo el día.* | 「一日中」で区切られている → ふつうは点過去 |
| 子どものころ、ピアノを**習った** | ~~Aprendí piano de pequeña.~~ ⚠ | *De pequeña aprendía piano.*（習っていた・習い事として） | 毎週の習慣として言うなら線過去 |

⚠ 3つ目は「習って身につけた（1つの完了したこと）」と言いたいなら *Aprendí a tocar el piano de pequeña.* も言えます。**「何を伝えたいか」で決まる**のがポイントです。

### ② 年齢と時刻は、ほぼいつも線過去

- ○ *Cuando **tenía** 10 años...*　× ~~Cuando tuve 10 años...~~
- ○ ***Eran** las tres.*　× ~~Fueron las tres.~~

### ③ 「期間」がついたら点過去

*durante dos horas*（2時間）、*tres años*（3年間）、*de 2015 a 2018*（2015年から2018年まで）のように**期間が区切られている**と、たとえ長くても点過去です。

> *Estudié inglés durante seis años.*（6年間英語を勉強した）

### ④ アクセント記号を忘れると意味が変わる

| 形 | 意味 |
|---|---|
| hablo | 私は話す（現在） |
| habló | 彼／彼女は話した（点過去） |
| hable | 話しますように（接続法：あとで習います） |
| hablé | 私は話した（点過去） |

### ⑤ fue は2つの意味

*fue* は ser（〜だった）と ir（行った）の両方の点過去です。前後の言葉で判断します。

- *Fue muy divertido.*（とても楽しかった）← ser
- *Fue a Madrid.*（マドリードに行った）← ir

### ⑥ 「〜したことがある」「今日〜した」は現在完了のことが多い

スペイン（本国）では、**今日・今週・今年・人生の経験**には現在完了（*he hablado*）をよく使います。

- *Hoy **he comido** paella.*（今日パエリアを食べた）
- *¿**Has estado** en Granada?*（グラナダに行ったことある？）

これは次のテーマ（②現在完了と点過去）でくわしくやります。（中南米では点過去を使うことも多いです）

---

## ステップ5：意味が変わる動詞

同じ動詞でも、線過去と点過去で意味が変わるものがあります。

| 動詞 | 線過去 | 点過去 |
|---|---|---|
| conocer | *Conocía a Ana.*（アナを知っていた） | *Conocí a Ana en 2020.*（2020年にアナと**知り合った**） |
| saber | *Sabía la verdad.*（本当のことを知っていた） | *Supe la verdad ayer.*（昨日本当のことを**知った**） |
| querer | *Quería ir.*（行きたかった） | *Quise ir, pero...*（行こうと**した**けど…）／*No quise ir.*（行くのを**断った**） |
| poder | *Podía nadar bien.*（上手に泳げた＝能力） | *Por fin pude abrir la puerta.*（やっとドアを開け**られた**＝実際にできた） |
| tener que | *Tenía que trabajar.*（働かなければならなかった＝したかは不明） | *Tuve que trabajar.*（働かなければならなかった＝実際に働いた） |

---

## 練習問題

### A. 活用（指示された形にしてください）

1. tener（yo・点過去）→ ______
2. hacer（ella・点過去）→ ______
3. ir（nosotros・線過去）→ ______
4. decir（ellos・点過去）→ ______
5. ser（tú・線過去）→ ______
6. pedir（él・点過去）→ ______

### B. 線過去と点過去、どちらでしょう？（　）の動詞を正しい形にしてください

1. Cuando era pequeña, (vivir, yo) ______ en Osaka.
2. Ayer (ir, yo) ______ al cine con unos amigos.
3. (Hacer) ______ sol y (hacer) ______ calor cuando salimos.
4. Mientras (cocinar, yo) ______, (sonar) ______ el teléfono.
5. (Vivir, yo) ______ en Madrid tres años, de 2015 a 2018.
6. Todos los veranos (ir, nosotros) ______ a la playa.
7. El verano pasado (ir, nosotros) ______ a la playa una vez.
8. Ayer (conocer, yo) ______ a la novia de Juan. ¡Es muy simpática!
9. (Ser) ______ las diez cuando (llegar, ellos) ______.
10. Estábamos en el parque y, de repente, (empezar) ______ a llover.

### C. まちがいを直してください

1. Cuando tuve 10 años, fui a Kioto con mi familia.
2. Antes fumé mucho, pero ahora no fumo.
3. Ayer Juan hació la cena para todos.

### D. 書いてみよう（自由に）

1. 子どものころのことを3文で書いてください。（線過去を使う）
2. 先週末にしたことを3文で書いてください。（点過去を使う）

---

## 答えと解説

### A.

1. **tuve**（不規則。アクセント記号なし）
2. **hizo**（c ではなく z。× hació）
3. **íbamos**（ir の線過去は不規則。í にアクセント記号）
4. **dijeron**（× dijieron）
5. **eras**（ser の線過去は不規則）
6. **pidió**（3人称で e → i）

### B.

1. **vivía** … 「子どものころ」の状況・背景 → 線過去
2. **fui** … 昨日の1回のできごと → 点過去
3. **Hacía / hacía** … 天気は背景の描写 → 線過去
4. **cocinaba / sonó** … 料理は途中だった（背景）、電話はそこに割りこんだできごと
5. **Viví** … 「3年間」「2015〜2018年」と区切られている → 長くても点過去
6. **íbamos** … 「毎年夏」の習慣 → 線過去
7. **fuimos** … 「去年の夏」に「1回」 → 点過去
8. **conocí** … 「初めて会った・知り合った」の意味 → 点過去（ステップ5）
9. **Eran / llegaron** … 時刻は線過去、着いたのはできごと
10. **empezó** … *de repente*（突然）で起きたこと → 点過去

### C.

1. Cuando **tenía** 10 años, fui a Kioto con mi familia.
   → 年齢は線過去。fui（行った）は1回のできごとなので点過去のままでOK。
2. Antes **fumaba** mucho, pero ahora no fumo.
   → 「以前はよく吸っていた」は昔の習慣 → 線過去。
3. Ayer Juan **hizo** la cena para todos.
   → hacer の点過去の3人称は不規則で **hizo**。

### D.（解答例）

1. *Cuando era pequeña, vivía en un pueblo cerca del mar. Todos los días jugaba con mis amigos en la playa. Mi casa era pequeña, pero muy bonita.*
   （小さいころ、海の近くの村に住んでいた。毎日、友だちと浜辺で遊んでいた。家は小さかったけど、とてもきれいだった。）
2. *El sábado fui al mercado y compré fruta. Por la tarde vi una película con una amiga. El domingo descansé en casa.*
   （土曜日は市場に行って果物を買った。午後は友だちと映画を見た。日曜日は家で休んだ。）
   ⚠ スペインでは「今週末（まだ同じ週）」のことは現在完了で言う人も多いです。先生がどちらを使うか、聞いてみてください。

# 現在完了（pretérito perfecto）と点過去（indefinido）

> 授業で先生の説明とちがうところがあったら、**先生の説明を優先**してください。
> この教材は**スペイン（本国）**の使い方です。中南米では、現在完了のかわりに点過去を使うことが多いです。

## もくじ

1. いちばん大事なルール
2. 現在完了の形（復習）
3. 使い分けの基本
4. 時の言葉で見分ける
5. 日本語話者がまちがえやすい点
6. 会話の例
7. 練習問題（答えと解説は最後）

---

## 1. ⭐ いちばん大事なルール

> **経験を話すとき**
> - **「いつ」を言わない → 現在完了**
>   *He estudiado alemán.*（ドイツ語を勉強したことがある）
> - **「いつ」を言いたい → 点過去**
>   *Estudié alemán cuando era estudiante.*（学生のとき、ドイツ語を勉強した）

会話では、よく**2つをつなげて**使います。

> *—¿**Has estado** alguna vez en Japón?*（日本に行ったことある？）
> *—Sí, **he estado** dos veces. La primera vez **fui** en 2018.*（うん、2回あるよ。最初は2018年に行った）

→ まず現在完了で「経験がある」と言い、くわしく「いつ」を話すときに点過去に切りかえます。

---

## 2. 現在完了の形（復習）

**haber ＋ 過去分詞**（*he, has, ha, hemos, habéis, han* ＋ *-ado / -ido*）

| よく使う不規則な過去分詞 | |
|---|---|
| hacer → **hecho** | decir → **dicho** |
| ver → **visto** | escribir → **escrito** |
| poner → **puesto** | volver → **vuelto** |
| abrir → **abierto** | romper → **roto** |

くわしくは「復習ノート」の 10月14日 を見てください。

---

## 3. 使い分けの基本

### イメージ：「今」とつながっているか

- **現在完了**：話している**今**とつながっている時間・経験
- **点過去**：**今とは切りはなされた**、終わった時間

| 現在完了 | 点過去 |
|---|---|
| **人生の経験**（いつかは言わない）<br>*He viajado a Italia.*（イタリアに行ったことがある） | **いつかがはっきりした経験**<br>*Viajé a Italia en 2020.*（2020年にイタリアに行った） |
| **今をふくむ時間**<br>*Hoy he trabajado mucho.*（今日はたくさん働いた） | **終わった時間**<br>*Ayer trabajé mucho.*（昨日はたくさん働いた） |
| **今に結果が残っていること**<br>*He perdido las llaves.*（鍵をなくした → 今もない） | **ただの過去のできごと**<br>*Perdí las llaves el mes pasado.*（先月、鍵をなくした） |

---

## 4. 時の言葉で見分ける

| 現在完了といっしょに使う | 点過去といっしょに使う |
|---|---|
| *hoy*（今日） | *ayer*（昨日） |
| *esta mañana*（今朝） | *anoche*（昨夜） |
| *esta semana*（今週） | *la semana pasada*（先週） |
| *este mes / este año*（今月／今年） | *el mes pasado / el año pasado*（先月／去年） |
| *alguna vez*（今までに一度でも） | *en 2019*（2019年に） |
| *nunca*（一度も〜ない） | *hace dos años*（2年前に） |
| *ya*（もう） / *todavía no*（まだ〜ない） | *el lunes*（月曜日に） |
| *últimamente*（最近） / *hasta ahora*（今まで） | *cuando era niño/a*（子どものころ） |

⚠ これは目安です。たとえば *nunca* は、*Nunca estuve allí*（点過去）のように使われることもあります。

---

## 5. 日本語話者がまちがえやすい点

### ① 「〜したことがある」に「いつ」をつけてしまう

日本語では「大学のときにドイツ語を勉強したことがある」と言えますが、スペイン語では「いつ」がつくと点過去になります。

- × ~~He estudiado alemán cuando era estudiante.~~
- ○ *Estudié alemán cuando era estudiante.*
- ○ *He estudiado alemán.*（「いつ」を言わないなら現在完了）

### ② 「2年前」は点過去

*hace dos años*（2年前に）は、はっきりした過去の時点なので点過去です。

- × ~~He llegado a España hace dos años.~~
- ○ *Llegué a España hace dos años.*（2年前にスペインに来た）

### ③ he と過去分詞の間には何も入れない

- ○ *No **he comido**.*　× ~~He no comido.~~
- ○ *Ya **he terminado**.*　× ~~He ya terminado.~~
- 再帰の *me / te / se* は *he* の**前**：*Me he levantado.*

### ④ 「もう〜した？」「まだ〜していない」

*ya* と *todavía no* は現在完了といっしょに使います。

> *—¿**Ya has hecho** los deberes?*（もう宿題した？）
> *—No, **todavía no** los **he hecho**.*（ううん、まだしてない）

---

## 6. 会話の例

> **Ana:** ¿**Has estado** alguna vez en Japón?
> 日本に行ったことある？【経験・現在完了】
>
> **Yuki:** ¡Claro! Soy japonesa. ¿Y tú?
> もちろん！日本人だもん。あなたは？
>
> **Ana:** No, **nunca he estado** en Asia. Pero **este año he empezado** a estudiar japonés.
> ううん、アジアには一度も行ったことがない。でも今年、日本語の勉強を始めたの。【経験・今年＝現在完了】
>
> **Yuki:** ¡Qué bien! ¿Cuándo **empezaste**?
> いいね！いつ始めたの？【「いつ」をたずねる → 点過去】
>
> **Ana:** **Empecé** en marzo. Y hoy **he aprendido** a escribir mi nombre en katakana.
> 3月に始めた。それで今日、カタカナで自分の名前を書けるようになったよ。【3月＝点過去／今日＝現在完了】

---

## 7. 練習問題

### A. 現在完了か点過去か。（　）の動詞を正しい形にしてください

1. ¿(Tú, comer) ______ alguna vez paella?
2. Ayer (yo, comer) ______ paella con mis amigos.
3. Este año (nosotros, viajar) ______ mucho.
4. El año pasado (nosotros, viajar) ______ mucho.
5. (Yo, llegar) ______ a España hace dos años.
6. Hoy (yo, levantarse) ______ a las siete.
7. Nunca (yo, ver) ______ una corrida de toros.
8. ¿(Vosotros, hacer) ______ ya los deberes?

### B. まちがいを直してください

1. He estudiado alemán cuando era estudiante.
2. El lunes he ido al médico.（今日は金曜日）
3. ¿Cuándo has empezado a estudiar español?

### C. 自分のことを書いてみよう

1. 「いつ」を言わずに、経験を1つ（現在完了）
2. 同じ経験について、「いつ」を入れて1つ（点過去）

---

## 答えと解説

### A.

1. **Has comido** … *alguna vez*（今までに一度でも）＝経験 → 現在完了
2. **comí** … *ayer*（昨日）＝終わった時間 → 点過去
3. **hemos viajado** … *este año*（今年）＝今をふくむ時間 → 現在完了
4. **viajamos** … *el año pasado*（去年）＝終わった時間 → 点過去
5. **Llegué** … *hace dos años*（2年前に）＝はっきりした時点 → 点過去
6. **me he levantado** … *hoy*（今日）→ 現在完了。*me* は *he* の前
7. **he visto** … *nunca*（一度も〜ない）＝経験 → 現在完了
8. **Habéis hecho** … *ya*（もう）→ 現在完了。*hacer* の過去分詞は不規則で *hecho*

### B.

1. ***Estudié** alemán cuando era estudiante.*
   → *cuando era estudiante*（学生のころ）と「いつ」を言っているので点過去。「いつ」を言わないなら *He estudiado alemán.*
2. ***El lunes fui** al médico.*
   → 今日が金曜日なら、月曜日はもう終わった日なので点過去。⚠ 同じ週なので、現在完了を使う人もいます。
3. *¿Cuándo **empezaste** a estudiar español?*
   → *¿Cuándo...?*（いつ？）は「いつ」をたずねる質問なので点過去。

### C.（解答例）

1. *He vivido en Inglaterra.*（イギリスに住んだことがある）
2. *Viví en Inglaterra en 2015.*（2015年にイギリスに住んでいた）

</script>

# B1でよく使う会話表現（場面ごと）

> - 「(ES)」はスペインでよく使う、くだけた言い方です。中南米ではあまり使わないことがあります。
> - 「＋接続法」と書いてある表現は、まだ習っていない形を使います。今は**かたまりで覚えるだけ**でOKです。
> - 授業で先生が別の言い方を教えたら、そちらを優先してください。

---

## 0. 授業で困ったとき（まずはこれ！）

先生がスペイン語だけで話すので、**この表を一番先に覚える**のがおすすめです。

| スペイン語 | 日本語 |
|---|---|
| Perdona, no lo he entendido. | すみません、わかりませんでした。 |
| ¿Puedes repetirlo, por favor? | もう一度言ってくれますか？ |
| ¿Puedes hablar más despacio, por favor? | もう少しゆっくり話してくれますか？ |
| ¿Qué significa «...»? | 「…」はどういう意味ですか？ |
| ¿Cómo se dice «...» en español? | 「…」はスペイン語で何と言いますか？ |
| ¿Cómo se escribe? | どうつづりますか？ |
| ¿Puedes escribirlo en la pizarra? | 黒板に書いてくれますか？ |
| ¿Qué tenemos que hacer? | 何をすればいいですか？ |
| ¿Para cuándo es? | いつまでですか？（宿題など） |
| ¿En qué página estamos? | 何ページですか？ |
| ¿Está bien así? | これで合っていますか？ |

※ EOIの先生には *tú* で話すことが多いですが、*usted* を使う先生もいます。迷ったら先生に合わせましょう。（*usted* なら *¿Puede repetirlo?*）

---

## 1. 聞き返す・確認する

| スペイン語 | 日本語 |
|---|---|
| ¿Perdona? / ¿Cómo? | え？（もう一度） |
| ¿Quieres decir que...? | 〜ということ？ |
| A ver si lo he entendido: ... | わかったか確認させて。… |
| ¿Te refieres a...? | 〜のこと？ |
| No sé si me explico. | うまく説明できているかな。 |

---

## 2. 意見を言う

| スペイン語 | 日本語 |
|---|---|
| Creo que... / Pienso que... | 〜と思う |
| Me parece que... | 〜のように思う |
| En mi opinión, ... / Para mí, ... | 私の意見では… |
| Yo diría que... | どちらかというと〜かな（控えめ） |
| No creo que ＋接続法 | 〜とは思わない（*No creo que sea fácil.* 簡単じゃないと思う） |
| ¿Tú qué opinas? / ¿Y tú qué piensas? | あなたはどう思う？ |

### 理由を言う

| スペイン語 | 日本語 |
|---|---|
| ..., porque... | 〜だから |
| Como..., ... | 〜なので、…（文の最初で） |
| Por eso... | だから… |
| Por un lado..., por otro lado... | 一方では…、もう一方では… |

---

## 3. 同意する・反対する

### 同意

| スペイン語 | 日本語 |
|---|---|
| Estoy de acuerdo (contigo). | （あなたに）賛成。 |
| Tienes razón. | その通りだね。 |
| ¡Claro! / ¡Por supuesto! | もちろん！ |
| Yo también. / Yo tampoco. | 私も。／私も〜ない。 |
| Es verdad. | 本当にそうだね。 |

### 一部だけ同意

| スペイン語 | 日本語 |
|---|---|
| Sí, pero... | うん、でも… |
| Depende. | 場合によるね。 |
| Tienes razón en parte, pero... | 一部はその通りだけど… |

### 反対

| スペイン語 | 日本語 |
|---|---|
| No estoy de acuerdo. | 賛成しない。 |
| Yo no lo veo así. | 私はそうは思わない。 |
| No sé... no estoy segura/o. | うーん、自信がないな。 |

※ *segura*（女性が言う）／ *seguro*（男性が言う）

---

## 4. 過去の話をする

### 話を始める

| スペイン語 | 日本語 |
|---|---|
| ¿Sabes qué me pasó ayer? | 昨日何があったと思う？ |
| Pues resulta que... | それがね、… |
| Una vez, ... | あるとき… |
| Cuando era pequeña/o, ... | 子どものころ… |
| Hace dos años, ... | 2年前… |

### 話を進める

| スペイン語 | 日本語 |
|---|---|
| Primero... luego... después... | まず…それから…そのあと… |
| De repente, ... | 突然… |
| En ese momento, ... | そのとき… |
| Al final, ... | 結局… |

### 聞き手のあいづち

| スペイン語 | 日本語 |
|---|---|
| ¿Y qué pasó? | それでどうなったの？ |
| ¿En serio? / ¿De verdad? | 本当に？ |
| ¡No me digas! | まさか！ |
| ¡Qué bien! / ¡Qué pena! | よかったね！／残念だね！ |
| ¡Qué fuerte! (ES) | すごい！／ひどい！（驚き） |

---

## 5. 考える時間をかせぐ

すぐに言葉が出ないときに使えます。黙るより、これを言うほうが自然です。

| スペイン語 | 日本語 |
|---|---|
| Pues... / Bueno... | えーと… |
| A ver... | ええと、そうだな… |
| Es que... | というのも… |
| ¿Cómo se dice...? | なんて言うんだっけ… |
| No me sale la palabra. | 言葉が出てこない。 |

---

## 6. 提案する・アドバイスする

| スペイン語 | 日本語 |
|---|---|
| ¿Por qué no...? | 〜したら？／〜しない？ |
| ¿Qué tal si...? | 〜するのはどう？ |
| Podríamos... | 〜してもいいかもね |
| Deberías... | 〜したほうがいいよ |
| Yo que tú, ... | 私があなたなら… |

---

## 7. グループ活動で使う

| スペイン語 | 日本語 |
|---|---|
| ¿Empiezo yo? | 私から始めようか？ |
| Te toca. | あなたの番だよ。 |
| ¿Quién empieza? | 誰から始める？ |
| ¿Lo escribo yo? | 私が書こうか？ |
| Creo que ya hemos terminado. | もう終わったと思う。 |

---

## 8. 線過去と点過去を使う会話の例

### 会話例1：週末の話

> **Marta:** ¿Qué tal el fin de semana?
> 週末どうだった？
>
> **Yuki:** Muy bien. El sábado **fui** a Toledo con unos amigos.
> よかったよ。土曜日、友だちとトレドに行ったの。【点過去：1回のできごと】
>
> **Marta:** ¡Qué bien! ¿Y qué tal el tiempo?
> いいね！天気はどうだった？
>
> **Yuki:** **Hacía** mucho sol, pero **hacía** un poco de frío.
> すごく晴れてたけど、ちょっと寒かった。【線過去：背景・天気】
>
> **Marta:** ¿Y qué **hicisteis**?
> 何したの？
>
> **Yuki:** Primero **visitamos** la catedral y luego **comimos** en un restaurante típico. ¡**Estuvo** genial!
> まず大聖堂を見て、それから伝統料理のレストランで食べた。最高だったよ！【点過去：できごとの連続】
>
> ⚠ スペインでは「今週末（同じ週）」のことを *He ido a Toledo* と現在完了で言う人も多いです。

### 会話例2：子どものころの話

> **Profesor:** Yuki, ¿cómo **eras** de pequeña?
> ユキ、小さいころはどんな子だった？
>
> **Yuki:** Pues... **era** muy tímida. No **hablaba** mucho en clase.
> えーと…とても恥ずかしがりだった。授業ではあまり話さなかった。【線過去：性格・習慣】
>
> **Profesor:** ¿Y qué te **gustaba** hacer?
> 何をするのが好きだった？
>
> **Yuki:** Me **gustaba** mucho dibujar. Todos los días **dibujaba** después del colegio.
> 絵を描くのが大好きだった。毎日、学校のあとに描いていた。【線過去：習慣】
>
> **Profesor:** ¿Y todavía dibujas?
> 今も描いてる？
>
> **Yuki:** No, **dejé** de dibujar cuando **empecé** a trabajar.
> ううん、働き始めたときにやめた。【点過去：変化が起きたとき】

### 会話例3：ハプニングの話（背景＋できごと）

> **Luis:** ¿Sabes qué me **pasó** ayer?
> 昨日何があったと思う？
>
> **Yuki:** No, ¿qué?
> ううん、何？
>
> **Luis:** **Estaba** en el metro y **leía** un libro. De repente, el metro **se paró** y **se apagaron** las luces.
> 地下鉄で本を読んでたんだ。突然、地下鉄が止まって、電気が消えた。【線過去：背景／点過去：起きたこと】
>
> **Yuki:** ¡No me digas! ¿Y qué **hiciste**?
> まさか！それでどうしたの？
>
> **Luis:** Nada. **Esperé** veinte minutos y al final **llegué** tarde a clase.
> 何も。20分待って、結局授業に遅刻した。【点過去】
>
> ※ *Estaba leyendo un libro*（読んでいる途中だった）という言い方もよく使います。

# 学習計画（2026年10月 〜 2027年6月）

## 前提

- 授業：週2回・各2時間（会話中心）
- 教科書：**Gente al día 2（B1）**＋練習帳（Cuaderno de ejercicios）
- 自習：**週2〜3時間**（1日20〜30分くらい）
- **教科書は2年分**：今年（B1.1）が前半、来年（B1.2）が後半です（去年までもそうだったとのこと）。
- 今年の目標：**0〜5課**をしっかり身につけること（2027年5〜6月まで）
- 10月22日の時点で、教科書は **p.17（0課）まで**終わっています。

> ⚠ 注意（推測をふくみます）
> - 「今年は0〜5課」は、教科書が10課あることから考えた**推測**です。実際にどこまで進むかは、授業に合わせて直します。
> - B1の認定試験（certificación）は、来年（B1.2）の終わりの可能性が高いです。今年の終わりに何かテストがあるかは、先生に確認してください（4. の質問文を使えます）。
> - 下の時期は**目安**です。授業の進み方に合わせて直します。

## 1. 1週間の過ごし方（例）

| いつ | 時間 | やること |
|---|---|---|
| 授業の日の夜 or 次の日 | 30分 × 2回 | **復習ノート**を作る（教科書の写真や授業のメモを送る → ノートと問題になる） |
| 別の日 | 30分 | **練習帳**の宿題をする → 答えのPDFで答え合わせ |
| 別の日 | 20分 | **次の課の文法**を予習する（下の表の「予習すること」） |
| 別の日 | 20分 | 習った表現で**1文ずつ文を作って**送る → チェック |
| 週末 | 20〜30分 | 1週間の復習（まちがえた問題だけやり直す） |

合計：約2〜2.5時間

**いちばん大事なのは「授業の前に少し予習、授業のあとに復習ノート」です。** 授業がスペイン語だけでも、先に文法を知っておくと聞き取りやすくなります。

### この計画のポイント

# B1で学ぶ文法とテーマの一覧

## この一覧の作り方（大事な注意）

- 基準は **セルバンテス文化センターの Plan curricular（PCIC）** と **CEFR（ヨーロッパ言語共通参照枠）** です。
- PCICは「B1」と「B2」を同じページにまとめています。サイトの文章を読み取ったとき、**どの項目がB1でどれがB2かの区切りが、はっきりしない部分がありました**。そのため「たぶんB1」の項目には **（推測）** と書いています。
- この一覧には教科書の内容は入れていません。教科書「Gente al día 2」の課の順番は、目次を見て「**学習計画**」のほうにまとめました（2026年10月23日）。
- 授業で先生の説明とちがうときは、**先生の説明を優先**してください。
- 参照ページ：https://cvc.cervantes.es/ensenanza/biblioteca_ele/plan_curricular/niveles/02_gramatica_inventario_b1-b2.htm

---

## 1. CEFRでいう「B1」とは

CEFRでは、B1は「自立した言語使用者」の入り口です。ざっくり言うと次のことができるレベルです。

- 仕事・学校・趣味など、**身近な話題**の要点がわかる。
- 旅行先で起こる**たいていの場面**に対応できる。
- 身近な話題について、**つながりのある簡単な文章**が書ける。
- **経験・できごと・夢・希望**を説明できる。
- **意見や計画の理由**を短く説明できる。

→ つまり「過去の話ができる」「意見と理由が言える」「これからのことを話せる」がB1の中心です。

---

## 2. 文法の一覧（PCICをもとに整理）

★ = 会話でとくによく使う・優先度が高いもの

### 2-1. 動詞（過去）

| 項目 | 内容 | 例 |
|---|---|---|
| ★線過去（pretérito imperfecto） | 背景・描写・習慣、ていねいな言い方 | *Iba por la calle y me encontré con él.*（道を歩いていたら彼に会った） |
| ★点過去（pretérito indefinido） | 終わったできごと、不規則動詞（tuve, dije, puse など） | *Lo supe ayer.*（昨日それを知った） |
| ★現在完了（pretérito perfecto）と点過去のちがい | 「今日・今まで」か「昨日・去年」か | *Nunca he estado allí.*（そこに行ったことがない） |
| 過去完了（pluscuamperfecto） | 過去のある時点より前のこと | *Cuando llegamos, ya se había ido.*（着いたとき、彼はもう帰っていた） |

### 2-2. 動詞（未来・仮定・ていねい）

| 項目 | 内容 | 例 |
|---|---|---|
| ★未来形（futuro） | 不規則形、未来のこと、**推量** | *Serán las once.*（11時ごろだろう） |
| ★過去未来（condicional） | ていねいなお願い、控えめな意見、アドバイス | *¿Podría hablar contigo?* / *Deberías descansar.* |
| 条件文（現実的なもの） | si + 現在形 → 現在／未来／命令 | *Si vienes, te lo digo.*（来たら教えるよ） |

### 2-3. 接続法（subjuntivo）と命令形

| 項目 | 内容 | 例 |
|---|---|---|
| ★接続法現在：形 | 規則形・不規則形（sea, vaya, esté, dé など） | — |
| ★願い | ojalá / quiero que + 接続法 | *Ojalá tengas suerte.*（うまくいくといいね） |
| ★評価・感情 | es bueno que / me encanta que + 接続法 | *Es bueno que estudies.* |
| ★否定の意見 | no creo que + 接続法 | *No creo que tengas razón.* |
| 目的 | para que + 接続法 | *Te lo doy para que lo uses.* |
| 未来の「〜したら」 | cuando / antes de que + 接続法 | *Cuando llegues, llámame.* |
| 疑い | quizá + 接続法 | *Quizá vaya.* |
| ★否定の命令 | no + 接続法と同じ形 | *No te vayas.*（行かないで） |
| 肯定の命令＋代名詞 | 代名詞を後ろにつける | *Díselo.*（彼にそれを言って） |
| 接続法過去 | 形と、一部の願いの表現 | **（推測）** B1では入門程度。本格的にはB2 |

### 2-4. 間接話法（estilo indirecto）

| 項目 | 例 |
|---|---|
| ★人の言ったことを伝える（現在） | *Dice que viene mañana.*（明日来るって） |
| 過去に言ったことを伝える | *Dijo que tenía sueño.*（眠いと言っていた） |

### 2-5. 代名詞・関係詞

| 項目 | 例 |
|---|---|
| ★目的語代名詞の組み合わせ | *Te las di.* / *Se lo di.* / *Voy a decírselo.* |
| se のいろいろな使い方 | 「お互いに」*Se quieren.*　「一般の人」*Se venden pisos.* |
| ★関係詞 que / donde / el que / quien | *La película que vimos.*（私たちが見た映画） |

### 2-6. よく使う動詞の組み合わせ（perífrasis）

| 形 | 意味 | 例 |
|---|---|---|
| soler + 不定詞 | いつも〜する | *Suelo cenar tarde.* |
| volver a + 不定詞 | また〜する | *Volví a llamarla.* |
| dejar de + 不定詞 | 〜するのをやめる | *Dejé de fumar.* |
| ponerse a + 不定詞 | 〜し始める | *Se puso a llorar.* |
| estar a punto de + 不定詞 | もうすぐ〜する | *Estaba a punto de salir.* |
| seguir + 現在分詞 | 〜し続ける | *Sigo estudiando.* |

### 2-7. ser / estar と「なる」の動詞

- ★ser と estar の基本的なちがい：*Es delgado.*（もともとやせている）／ *Está delgado.*（今やせている）
- ser でイベントの場所：*La fiesta es en mi casa.*
- 「〜になる」：ponerse（一時的）、quedarse、hacerse、volverse　*Se puso nervioso.*（緊張した）

### 2-8. 文をつなぐ言葉

| 種類 | 言葉 |
|---|---|
| ★時 | cuando, mientras, antes de, después de, hasta que, al + 不定詞 |
| ★理由 | porque, como（文の最初に置く）, por + 不定詞 |
| ★結果 | así que, o sea que, por eso |
| ★逆接 | pero, sin embargo, aunque + 直説法 |
| 比較 | igual de... que, más/menos... que |

---

## 3. テーマ（話題）の一覧

PCICの「Nociones específicas（具体的な話題）」とCEFR B1の内容から、**会話の授業で出やすいもの**を選びました。どれがいつ授業に出るかは教科書や先生しだいなので、**順番は決めていません**。

| テーマ | よく話す内容 | 使う文法の例 |
|---|---|---|
| 自分と家族・人間関係 | 性格、子どものころの話、友だち | 線過去、ser/estar |
| 経験・思い出 | 旅行、人生のできごと、失敗談 | 点過去・線過去・現在完了 |
| 食べ物 | 好きな料理、レシピ、レストラン | 命令形、se impersonal |
| 住まい・町 | 家探し、近所、町の変化 | 線過去（昔は〜だった）、比較 |
| 仕事・勉強 | 経歴、将来の計画、学校 | 点過去、未来形 |
| 健康・体 | 体調、アドバイス | 過去未来（deberías）、命令形 |
| 余暇・旅行 | 予定を立てる、旅行の話 | 未来形、点過去 |
| 買い物・サービス | お店、苦情、お願い | 過去未来（ていねい） |
| メディア・ニュース | ニュースを伝える、意見を言う | 間接話法、意見の表現 |
| 環境・社会 | 問題と解決策、意見 | 接続法（es importante que） |
| 文化・習慣 | 日本とスペインのちがい | 比較、soler |
| 気持ち・願い | 希望、感情 | 接続法（ojalá, me alegra que） |

---

## 4. 「できること（機能）」の一覧

B1の会話で求められる「すること」です。会話表現集（`会話表現/`フォルダ）とつながっています。

- 過去の経験を話す・物語を語る
- 意見を言う・理由を言う
- 同意する・反対する
- 聞き返す・確認する
- アドバイスする・提案する
- 願い・気持ちを伝える
- 人の話を伝える
- 計画・予定を話す

# 2026-10-14（水）｜現在完了「Mi vida hasta hoy」

> **宿題（推測）**：プリントに「作文を書く」とあるので、宿題の可能性が高いです。締め切りと長さは先生に確認してください（7. の質問文を使えます）。

## 1. 今日の授業のまとめ

- テーマは **現在完了（pretérito perfecto）**：*he viajado*（旅行したことがある）、*he estudiado*（勉強した）など。
- 課題は「**Mi vida hasta hoy**（今までの私の人生）」という短い作文。
- 「人生の経験」「最近したこと」「今につながっていること」を、時を表す言葉（*nunca*, *hoy*, *este año* など）を使って書く。

### プリントの日本語訳

**「今までの私の人生」**
次の点を入れて、短い作文を書きましょう。

- 人生の**経験を3つ**（*he viajado*＝旅行したことがある、*he estudiado*＝勉強したことがある、*he conocido*＝知り合ったことがある…）
- **最近したことを2つ**（*esta semana*＝今週、*este mes*＝今月、*hoy*＝今日…）
- **今に結果が残っていること1つ**（*me he roto...*＝〜を骨折した、*he perdido...*＝〜をなくした、*he aprendido...*＝〜を覚えた…）
- 授業で習った**時の表現を2つ以上**（*alguna vez*＝今までに一度でも、*nunca*＝一度も〜ない、*este año*＝今年、*hoy*＝今日、*hasta ahora*＝今まで、*últimamente*＝最近）

**ヒント**：次の質問に答えてもいいです。

| スペイン語 | 日本語 |
|---|---|
| ¿Qué has hecho este año? | 今年は何をした？ |
| ¿Qué lugares has visitado? | どんな場所に行ったことがある？ |
| ¿Qué actividades nuevas has aprendido? | どんな新しいことを覚えた？ |
| ¿Qué experiencias has tenido en tu vida? | 人生でどんな経験をした？ |
| ¿Qué has hecho hoy o esta semana? | 今日や今週は何をした？ |
| ¿Qué ha cambiado en tu vida recientemente? | 最近、生活で何が変わった？ |

## 2. 新しい単語・表現

| スペイン語 | 日本語 | 例文 |
|---|---|---|
| el alumnado | 生徒たち（全員） | *El alumnado debe escribir una redacción.*（生徒は作文を書かなければならない） |
| una redacción | 作文 | *He escrito una redacción.*（作文を書いた） |
| tener en cuenta | 〜を考えに入れる | *Ten en cuenta estos puntos.*（これらの点を考えに入れて） |
| reciente / recientemente | 最近の／最近 | *¿Qué ha cambiado recientemente?* |
| una consecuencia | 結果 | — |
| al menos | 少なくとも | *Usa al menos dos expresiones.*（少なくとも2つの表現を使って） |
| una guía de apoyo | ヒント・手引き | — |
| alguna vez | 今までに一度でも | *¿Has estado alguna vez en Japón?*（日本に行ったことある？） |
| hasta ahora | 今まで | *Hasta ahora todo ha ido bien.*（今まで全部うまくいっている） |
| últimamente | 最近 | *Últimamente he dormido poco.*（最近あまり寝ていない） |
| romperse | （骨などを）折る、こわれる | *Me he roto el brazo.*（腕を骨折した） |

## 3. 文法のポイント：現在完了（pretérito perfecto）

### 形：haber ＋ 過去分詞

| | haber | ＋ 過去分詞 |
|---|---|---|
| yo | **he** | viaj**ado** |
| tú | **has** | com**ido** |
| él / ella / usted | **ha** | viv**ido** |
| nosotros | **hemos** | estudi**ado** |
| vosotros | **habéis** | conoc**ido** |
| ellos / ustedes | **han** | aprend**ido** |

- 過去分詞の作り方：-ar → **-ado**、-er / -ir → **-ido**
- 過去分詞は**形が変わりません**（女性でも複数でも *viajado* のまま）。

### 不規則な過去分詞（よく出るもの）

| 原形 | 過去分詞 | 原形 | 過去分詞 |
|---|---|---|---|
| hacer（する） | **hecho** | decir（言う） | **dicho** |
| ver（見る） | **visto** | escribir（書く） | **escrito** |
| poner（置く） | **puesto** | volver（戻る） | **vuelto** |
| abrir（開ける） | **abierto** | romper（こわす） | **roto** |
| morir（死ぬ） | **muerto** | descubrir（発見する） | **descubierto** |

### いつ使う？（スペインの場合）

1. **人生の経験**（いつかは言わない）
   > *He viajado a Italia dos veces.*（イタリアに2回行ったことがある）
   > *Nunca he comido pulpo.*（タコを食べたことが一度もない）
2. **「今」をふくむ時間の中でしたこと**（*hoy, esta semana, este año*）
   > *Hoy he hablado con mi profesora.*（今日、先生と話した）
3. **今に結果が残っていること**
   > *He perdido las llaves y no puedo entrar en casa.*（鍵をなくしたので、家に入れない）

### 点過去とのちがい（ここが大事！）

| 現在完了 | 点過去 |
|---|---|
| ***Hoy** he ido al médico.*（今日、病院に行った） | ***Ayer** fui al médico.*（昨日、病院に行った） |
| ***Este año** he viajado mucho.*（今年はたくさん旅行した） | ***El año pasado** viajé mucho.*（去年はたくさん旅行した） |
| *¿**Alguna vez** has estado en Japón?*（日本に行ったことある？） | *Estuve en Japón **en 2019**.*（2019年に日本に行った） |

→ **「今」とつながっている時間なら現在完了、もう終わった時間なら点過去**。

> ⭐ **大事なルール：経験を話すとき**
> - **「いつ」を言わない → 現在完了**：*He estudiado alemán.*（ドイツ語を勉強したことがある）
> - **「いつ」を言いたい → 点過去**：*Estudié alemán cuando era estudiante.*（学生のとき、ドイツ語を勉強した）
>
> くわしくは「文法：02_現在完了と点過去」を見てください。

### 日本語話者が気をつけること

- **he と動詞の間に何も入れない**：○ *No he comido.* × ~~He no comido.~~　○ *Nunca he estado.* × ~~He nunca estado.~~
- **再帰動詞の me / te / se は he の前**：○ *Me he levantado tarde.*（遅く起きた）
- 中南米では、現在完了のかわりに点過去を使うことが多いです。授業では先生（スペイン）の使い方に合わせましょう。

## 4. 次の授業で使える表現

1. *¿Alguna vez has estado en...?* — 〜に行ったことある？
2. *Nunca he...* — 一度も〜したことがない。
3. *¿Qué has hecho este fin de semana?* — 週末なにしたの？（⚠ 月曜日などに聞くとき。点過去を使う人もいます）

## 5. 作文の例（参考）

条件を全部入れた例です。**[ ] の部分を自分のことに変えて**使ってください。

> **Mi vida hasta hoy**
>
> Me llamo [名前] y soy de Japón. En mi vida **he hecho** muchas cosas interesantes. **He viajado** por [varios países de Europa] y **he conocido** a personas de todo el mundo. También **he estudiado** [inglés] durante muchos años. **Nunca he estado** en [Sudamérica], pero me gustaría ir algún día.
>
> **Esta semana he empezado** a escribir un diario en español. **Hoy he hablado** con mi profesora después de clase.
>
> **Últimamente he aprendido** muchas palabras nuevas, así que ahora entiendo mejor a la gente en la calle.
>
> **Hasta ahora**, mi vida en España **ha sido** una gran aventura.

日本語訳：
私の名前は[名前]で、日本出身です。今までにおもしろいことをたくさんしてきました。[ヨーロッパのいくつかの国]を旅行したことがあり、世界中の人と知り合いました。また、[英語]を長年勉強しました。[南米]には一度も行ったことがありませんが、いつか行ってみたいです。
今週、スペイン語で日記を書き始めました。今日は授業のあと先生と話しました。
最近たくさんの新しい単語を覚えたので、今は町の人の話が前よりわかります。
今までのところ、スペインでの生活は大冒険です。

**チェック**：経験3つ（*he viajado, he conocido, he estudiado*）／最近のこと2つ（*esta semana, hoy*）／今に結果が残っていること1つ（*he aprendido → ahora entiendo*）／時の表現（*nunca, esta semana, hoy, últimamente, hasta ahora*）

## 6. 練習問題

1. 過去分詞にしてください：① hacer ② ver ③ escribir ④ volver ⑤ romper
2. Este año (yo, viajar) ______ a Portugal.
3. ¿(Tú, estar) ______ alguna vez en Japón?
4. Nosotros nunca (ver) ______ esa película.
5. Esta mañana (yo, levantarse) ______ muy tarde.
6. 現在完了か点過去か：① Ayer (yo, ir) ______ al médico. ② Hoy (yo, ir) ______ al médico.
7. まちがいを直してください：*He no terminado la redacción.*

## 答えと解説

1. ① **hecho** ② **visto** ③ **escrito** ④ **vuelto** ⑤ **roto**（全部不規則。そのまま覚えましょう）
2. **he viajado** … *este año*（今年）は「今」をふくむ時間なので現在完了
3. **Has estado** … *alguna vez*（今までに一度でも）は経験をたずねる表現
4. **hemos visto** … *nunca* は he の前に置く（*Nosotros nunca hemos visto*）。*No hemos visto nunca* も正しいです
5. **me he levantado** … 再帰の *me* は *he* の前に置く。*esta mañana*（今朝）は今日の中なので現在完了
6. ① **fui**（*ayer* はもう終わった時間 → 点過去） ② **he ido**（*hoy* は今をふくむ → 現在完了）
7. ***No he terminado** la redacción.* … *no* は *he* の前。he と過去分詞の間には何も入れません

## 7. 先生に聞くとよいこと

- 作文の締め切りはいつですか？
  - *¿Para cuándo es la redacción?*
- 何語くらい書けばいいですか？
  - *¿Cuántas palabras tiene que tener?*
- 手書きで出しますか？メールで出しますか？
  - *¿La entregamos a mano o por correo electrónico?*
- 「今週末」のことは、現在完了と点過去のどちらを使えばいいですか？
  - *Para hablar del fin de semana, ¿usamos el pretérito perfecto o el indefinido?*

## 8. 自信がない部分（推測）

- **宿題かどうか**は、プリントからはわかりません。「作文を書く」課題なので、宿題か授業中の課題だと思われます。
- 授業で先生が話した内容（口頭の説明）は、プリントにないのでわかりません。このノートは**プリントだけ**をもとにしています。
- 「週末のこと」に現在完了と点過去のどちらを使うかは、人や地域によってちがいます。先生の使い方を優先してください。

## 3. 文法のポイント

### ① me interesa / me cuesta / me parece ―「gustar と同じ形」の動詞

*gustar* と同じで、**好き・苦手・興味の「対象」が主語**になります。対象が1つなら単数、複数なら複数にします。

| 動詞 | 1つ・動詞の原形 | 複数 |
|---|---|---|
| interesar（興味がある） | *Me interesa **la música**.* | *Me interesan **las culturas hispanas**.* |
| costar（苦手、難しい） | *Me cuesta **hablar**.* / *Me cuesta **la pronunciación**.* | *Me cuestan **los verbos**.* |
| parecer（〜だと思う） | *Me parece **útil** ver series.* | *Me parecen **aburridos** los ejercicios.* |

- 動詞の原形（*hablar* など）がくるときは、いつも**単数**です。
- *me parece(n)* のあとの形容詞は、**対象に合わせて変化**します（*aburridos* は *los ejercicios* に合わせた形）。

### ② 現在分詞（gerundio）＝「〜しながら」「〜することで」

| 原形 | 作り方 | 現在分詞 |
|---|---|---|
| hablar | -ar → **-ando** | habl**ando** |
| aprender | -er → **-iendo** | aprend**iendo** |
| escribir | -ir → **-iendo** | escrib**iendo** |
| leer / ir | 不規則 | **leyendo** / **yendo** |
| decir / dormir | 不規則 | **diciendo** / **durmiendo** |

> *Aprendo español **escuchando** música.*（音楽を聞きながらスペイン語を学ぶ）
> *Se aprende a hablar **hablando**.*（話すことは、話すことで身につく）

⚠ **ノートの直し**：「aprendido＝学びながら」とメモしてありましたが、「学びながら」は ***aprendiendo*** です。*aprendido* は過去分詞で、*he aprendido*（学んだ）のように使います。

### ③ por / porque / para ― 理由と目的

| 質問 | 答え方 | 例 |
|---|---|---|
| **¿Por qué?**（なぜ？） | **porque ＋ 文** | *Porque tengo amigos españoles.* |
| | **por ＋ 名詞** | *Por mi trabajo.* |
| **¿Para qué?**（何のために？） | **para ＋ 動詞の原形** | *Para viajar.* |
| | **para ＋ 名詞** | *Para mis estudios.* |

→ ノートのメモ（porque＋文、por＋名詞、para＋動詞・名詞）は正しいです！

### ④ 語学のレベルを言う

> *Hablo inglés **bastante bien**.*（英語をかなり上手に話す）
> *Entiendo el alemán, pero **me cuesta** hablar.*（ドイツ語はわかるけど、話すのは苦手）
> *Mi nivel de español es **intermedio**.*（スペイン語は中級です）

   （スペインに住んでいるので、人と話すためにスペイン語を勉強しています）
2. **苦手**：*Me cuesta mucho **entender cuando alguien habla rápido**.*
   （人が速く話すと、理解するのがとても難しいです）
3. **学び方**：*Aprendo español **escribiendo frases y corrigiéndolas con la IA**.*
   （文を書いて、AIで直しながらスペイン語を学んでいます）

## 5. 練習問題

1. 正しいほうを選んでください：Me (cuesta / cuestan) los verbos irregulares.
2. 正しいほうを選んでください：Me (interesa / interesan) el cine español.
3. 現在分詞にしてください：① leer ② aprender ③ ir
4. （　）に porque / por / para を入れてください：Estudio español (　) viajar por Sudamérica.
5. （　）に porque / por / para を入れてください：Estudio español (　) mi trabajo.
6. まちがいを直してください：*Me parece aburrido los ejercicios de gramática.*

## 答えと解説

1. **cuestan** … *los verbos*（複数）が主語なので複数形
2. **interesa** … *el cine*（1つ）が主語なので単数形
3. ① **leyendo** ② **aprendiendo** ③ **yendo**（3つとも、よく出る形です）
4. **para** … 「旅行するため」＝目的。後ろが動詞の原形
5. **por** … 「仕事のため（理由）」＝後ろが名詞。*porque* なら、後ろに文が必要です
6. *Me **parecen aburridos** los ejercicios de gramática.* … *los ejercicios* が複数なので、*parecer* も形容詞も複数形にします

## 1. Primeras palabras

## 3. Estudiantes de español（音声01）

**指示文の意味**：3人の学生が、スペイン語を学ぶ理由を話します。聞いて、書きましょう。

### 3つの質問の意味と、答え方の形

3人について話すので、動詞は**3人称（彼・彼女）**になります。

| 質問 | 意味 | 答え方の形 |

| ¿Por qué el español? | なぜスペイン語？ | ***Porque*** ＋ 文（*Porque **le** interesa...*） |
| ¿Qué le interesa? | 何に興味がある？ | ***Le interesa*** ＋ 1つ／***Le interesan*** ＋ 複数 |
| ¿Para qué? | 何のため？ | ***Para*** ＋ 動詞の原形（*Para viajar.*） |

### やり方

1. 音声01を聞きます。音声は CAMPUS の「AUDIOS」か、教科書についている音声にあります（推測）。

3. もう一度聞いて、文にします。
4. PDFで答え合わせをします。むずかしければ、CAMPUS の「TRANSCRIPCIONES AUDIOS CUADERNO（練習帳の音声の書き起こし）」を見ながら聞くのもおすすめです。

**指示文の意味**：3人のスペイン語学習者が書いた文章を読んで、**自分と同じところすべてに線**を引きましょう。それから、自分のプロフィール・希望・必要なことについて、同じような文章を書きましょう。

### 3つの文章のあらすじ

|---|---|---|
| Klaus | 語学学校へのていねいなメール | 文法はできるけど、**話す練習**が必要。仕事で会議に出たり、論文を読んだりする。コースの情報がほしい |
| Sandra | 語学学校へのていねいなメール | 1年勉強したけど、まだ初心者。**文法と翻訳**の多いコースがいい。勉強のために書く力も必要 |
| John | 言語交換の相手をさがす広告 | 学校で文法はたくさん勉強したけど、**ネイティブの話がわからない**し、発音も苦手。来年、中南米を旅行したい |

### 線を引くところ（あなたの場合の例・推測）

授業がわからなくて困っていることから考えると、次のような文が「同じ」かもしれません。

- 「話す練習がたくさん必要」（Klaus）
- 「ネイティブの話を理解するのがとても大変」（John）
- 「会話に参加するのが大変」（John）

### ていねいなメールで使う表現

| スペイン語 | 日本語 |
|---|---|
| Muy señores míos: | 拝啓（会社や学校あて） |
| Me dirijo a ustedes para ＋ 原形 | 〜のためにご連絡しています |
| Me dirijo a ustedes porque ＋ 文 | 〜なのでご連絡しています |
| Les agradecería que me enviaran... | 〜を送っていただけるとありがたいです |
| Un cordial saludo, / Atentamente, | 敬具 |

### 自分の文章の型（[ ] を自分のことに変える）

> Me llamo [名前] y soy [japonesa / japonés]. Vivo en [España] desde hace [〇年].
> Estudio español en la EOI. Mi nivel es B1, pero **me cuesta mucho entender** a la gente cuando habla rápido.
> **Necesito** practicar más la conversación, **porque** quiero hablar con mis vecinos y amigos.
> **Me interesa** [la cultura española / la cocina / el cine...].
> **He estudiado** alemán en la universidad y **he viajado** a Italia.
> Quiero mejorar mi español **para** [trabajar / viajar / entender las noticias...].

日本語訳：
私の名前は[名前]で、日本人です。[〇年]前から[スペイン]に住んでいます。
EOIでスペイン語を勉強しています。レベルはB1ですが、人が速く話すと、理解するのがとても難しいです。
近所の人や友だちと話したいので、もっと会話の練習が必要です。
[スペインの文化／料理／映画]に興味があります。
大学でドイツ語を勉強したことがあり、イタリアに行ったことがあります。
[仕事／旅行／ニュースを理解する]ために、スペイン語を上達させたいです。

*japonesa* は女性、*japonés* は男性が自分のことを言うときの形です。

**ポイント**：この型には、0課の表現（*me cuesta, me interesa, porque, para*）と、この前習った現在完了（*he estudiado, he viajado*）が入っています。

**書いたら送ってください。チェックします！**

## 5. Se aprende haciendo（やりながら覚える）

**指示文の意味**：練習することで覚えるものがあります。

**やり方**：*Se aprende a* ＋ 原形 … のあとに、**同じ動詞の現在分詞**を書きます。

> *Se aprende a andar **andando**.*（歩くことは、歩きながら覚える）

| 原形 | 作り方 | 現在分詞 |
|---|---|---|
| -ar の動詞 | -ar → **-ando** | esquiar → esqui**ando** |
| -er / -ir の動詞 | → **-iendo** | traducir → traduc**iendo** |
| 不規則 | 右の囲みを見る | ir → **yendo** |

**気をつけるところ**
- 8番：*tocar el piano* → 「それ（ピアノ）をひきながら」なので、現在分詞に ***lo*** をつけます：***tocándolo***。代名詞をつけると、**á にアクセント記号**が必要になります。
- 9番：*ir en bici* → ***yendo en bici***（ir の現在分詞は不規則で *yendo*）。

---

## 6. ¿Cómo aprendiste japonés?（どうやって日本語を覚えたの？）

**指示文の意味**：例を見てから、**現在分詞**か **sin ＋ 原形**を使って、ほかの質問に答えましょう。

**ルール**
- **(sí) ✓**（した） → **現在分詞**：*estudiando en casa*（家で勉強しながら）
- **(no) ✗**（しなかった） → **sin ＋ 原形**：*sin ir a clase*（授業に行かずに）

> 例：*Sin ir a clase, estudiando en casa.*（授業に行かずに、家で勉強して）

| 番号 | 質問の意味 | ヒント |
|---|---|---|
| 2 | どうやって写真を覚えたの？ | 写真家と話す ✓／コースを受ける ✗ |
| 3 | どうやってそんなにいい発音になったの？ | ネイティブと話す ✓／歌を聞く ✓（2つとも現在分詞） |
| 4 | この文章をどうやって翻訳したの？ | 辞書を見る ✓／1語ずつ訳す ✗ |
| 5 | どうやってギターを覚えたの？ | 楽譜（*solfeo*）を勉強する ✗／耳で（*de oído*）ひく ✓ |

**気をつけるところ**：*sin* のあとは、いつも**原形**です（× ~~sin hablando~~ → ○ *sin hablar*）。

---

## 7. Aprobé sin estudiar（勉強しないで合格した）

**指示文の意味**：あなたは？ 6番のような例を、自分の経験から作りましょう。

**自由に書く問題**です。例文の *En la universidad aprobé muchos exámenes sin estudiar.*（大学では、勉強しないでたくさんの試験に合格した）のように、**点過去＋現在分詞／sin＋原形**で書きます。

**書くための型（[ ] を自分のことに）**
- *Aprendí [alemán] **estudiando** en la universidad, **sin ir** a [Alemania].*
  （ドイツに行かずに、大学で勉強してドイツ語を覚えた）
- *Aprendí a [cocinar] **mirando** vídeos en internet.*
  （ネットの動画を見て、料理を覚えた）
- *He mejorado mi español **hablando** con [mis vecinos].*
  （近所の人と話して、スペイン語が上手になった）

書いたら送ってください。チェックします！

## 8. Me cuesta entender（理解するのが難しい）

**指示文の意味**：Kathrin、Mateo、Francesca が、苦手なことや、簡単・おもしろい・楽しいと思うことを話します。聞いて文をうめましょう（音声02）。

**文の形**（3人について話すので、*le* になります）

| 形 | 意味 |
|---|---|
| *A Kathrin **le cuesta** ＋ 原形／名詞* | Kathrin は〜が苦手 |
| *No le cuesta nada ＋ 原形* | 〜はぜんぜん苦労しない |
| *Le cuesta**n** ＋ 複数の名詞* | 〜（複数）が苦手 |
| *Le parece**n** muy interesantes ＋ 複数の名詞* | 〜がとてもおもしろいと思っている |
| *Algunas palabras no le **salen** bien* | いくつかの言葉が、うまく言えない |

**やり方**：1回目は聞くだけ、2回目でうめる、最後にPDFで答え合わせ。聞き取れないときは、CAMPUS の「練習帳の音声の書き起こし」を見ながら聞きましょう。

## 9. Lo más útil ha sido（いちばん役に立ったのは）

**指示文の意味**：今までのスペイン語の授業を評価しましょう。

| 書き出し | 意味 |
|---|---|
| Lo más útil… | いちばん役に立ったのは… |
| Lo más aburrido… | いちばんつまらなかったのは… |
| Lo más difícil… | いちばん難しかったのは… |
| Lo más interesante… | いちばんおもしろかったのは… |
| Lo más divertido… | いちばん楽しかったのは… |

**形**：*Lo más* ＋ 形容詞 ＋ ***ha sido*** ＋ 原形／名詞。
「今までの授業」なので、**現在完了の *ha sido*** を使います（10月14日に習ったルールです）。

**例**
- *Lo más útil **ha sido** hablar en parejas.*（いちばん役に立ったのは、ペアで話すことだった）
- *Lo más difícil **ha sido** entender a la profesora.*（いちばん難しかったのは、先生の話を理解することだった）
- *Lo más interesante **ha sido** conocer a compañeros de otros países.*（いちばんおもしろかったのは、ほかの国のクラスメートと知り合ったこと）

## 10. Aprender otra lengua（ほかの言語を学ぶ）

**指示文の意味**：語学学習についての意見を読んで、自分の反応に印をつけましょう。そのあと、授業でグループになって話し合います。

**4つの意見のあらすじ**（それぞれ、「賛成」「半分賛成」「反対」の3つから選びます）

| 番号 | 意見 | 3つの反応（上から） |
|---|---|---|
| 1 | 文法をしっかり学ぶのがとても大事。文法なしでは話せない | 完全に賛成／本当だけど、文法だけが大事なわけではない／ちがうと思う。子どもみたいに文法なしでも話せる |
| 2 | 先生は、話すときのまちがいを全部直すべき | 本当。直してくれないと同じまちがいをくり返す／ときどきは。必要なときだけ／ぜんぜん反対。たくさん直されると、話すのがいやになって黙ってしまう |
| 3 | 授業でいちばん大事なのは、とにかく話すこと | 完全にそう／話すことと書くことは同じくらい大事／いや、いちばん役に立つのは文法問題 |
| 4 | 先生が自分の言語を知っていれば、もっと助けてくれる | そう、賛成／ときどきは（訳や説明のとき）。でも、なくてもいい／自分の言語？ これはスペイン語の授業でしょ？ |

**授業で話すための表現**（会話表現集の「同意・反対」も見てください）
- *Estoy completamente de acuerdo.*（完全に賛成）
- *Bueno, creo que es verdad, pero...*（まあ、本当だと思うけど…）
- *No estoy de acuerdo en absoluto.*（ぜんぜん賛成しない）

## 11〜13. 言葉と文化（Así puedes aprender mejor）

### 11. Las palabras y las cosas

**指示文の意味**：*pan*（パン）と *desayuno*（朝ごはん）という言葉から、**最初に思いうかぶ言葉**を書きましょう。

自由に書く問題です。日本人のあなたが思いうかべる言葉で大丈夫です（例：*desayuno* → *arroz*、*sopa de miso*、*pescado*…）。

### 12. ¿Pan? ¡Desayuno!

**指示文の意味**：スペイン語を話す人たちの答えを聞いて（音声03）、11番の自分の答えとくらべましょう。

**くらべるポイント**：スペインや中南米の人が「朝ごはん」で思いうかべるもの（*tostadas*, *café con leche*, *zumo* など）と、自分の答えのちがい。

### ESTRATEGIAS（コツ）の囲みの意味

スペイン人が言う「パン」と、ドイツ人が言う「Brot」、フランス人が言う「pain」は、まったく同じものではありません。社会によって、物の使い方や大切さがちがうからです。だから、言葉には**文化のイメージ**がつまっています。辞書の訳は便利ですが、それだけでは足りません。言葉を本当に覚えるには、**いつ・どう使うか**と、その**文化的な背景**も知る必要があります。

### 13. ¿Qué te sugieren?

**指示文の意味**：5つの言葉から何を思いうかべますか？ 書いてから、クラスメートとくらべましょう。たくさん同じでしたか？ 文化と言葉の意味について、どんなことがわかりますか？

| 言葉 | 意味 |
|---|---|
| boda | 結婚式 |
| mercado | 市場 |
| amigo/a | 友だち |
| verano | 夏 |
| familia | 家族 |

**書くときのヒント**：日本と、今住んでいるスペインで、イメージがちがう言葉を探すとおもしろいです。授業で話すときは、こう言えます。

> *Para mí, "verano" es calor, playa y fuegos artificiales.*（私にとって「夏」は、暑さ、海、花火です）
> *En Japón, una boda es muy formal, pero aquí es más larga y divertida.*（日本の結婚式はとてもかしこまっているけど、ここではもっと長くて楽しい）

---

# 2026-10-26（月）｜練習帳の答え合わせと1課「Gente que se conoce」スタート

> **やること（推測）**：練習帳⑨⑩がまだ空いています。1課のプリント（Ficha de trabajo 3・5・6）が宿題かどうかは、先生に確認してください（7. の質問文を使えます）。

## 1. 今日の授業のまとめ

- 練習帳 0課（p.12〜14）の答え合わせ。**現在分詞（gerundio）**と **dejar de ＋ 原形**を復習した。
- スペインの口語の表現をいくつか習った（*zorro*, *Nos van a dar las uvas*, *mala leche* など）。
- **1課「Gente que se conoce」（人を知る）**が始まり、プリント（Ficha de trabajo 3・5・6）をもらった。動画の Claudia について答えるものと、「もし〜だったら？」を **過去未来（condicional）**で答えるもの。

## 2. ⭐ とても大事：estar ＋ 現在分詞 と 現在分詞だけ のちがい

> ⭐ **ここは何度も見返すところ！**
> - **estar ＋ 現在分詞** ＝ **今〜しているところ**（進行形）
> - **現在分詞だけ** ＝ **〜しながら、〜することで**（やり方）
>
> *estar* があるかないかで、**意味が変わります**。

**きっかけになった質問**：「*Sin ir a clase, estudiando en casa*」に *estar* は要らない？
→ **要りません。**「どうやって覚えたの？」への答えで、**やり方**を言っているからです。

| 形 | 意味 | 例 |
|---|---|---|
| **estar ＋ 現在分詞** | 今〜しているところ（進行形） | *Estoy estudiando en casa.*（今、家で勉強しているところ） |
| **現在分詞だけ** | 〜しながら、〜することで（やり方） | *Aprendí japonés estudiando en casa.*（家で勉強して日本語を覚えた） |

**同じ動詞でくらべると**

| 文 | 意味 |
|---|---|
| *Estoy **escuchando** música.* | 今、音楽を聞いているところ |
| *Aprendo español **escuchando** música.* | 音楽を聞きながら（聞くことで）スペイン語を学んでいる |
| *Estaba **leyendo** cuando llamaste.* | 電話をくれたとき、本を読んでいた |
| *Mejoré mi español **leyendo** novelas.* | 小説を読んで、スペイン語が上達した |

**見分け方のコツ**
- 「**今（そのとき）何をしている？**」に答える → ***estar*** をつける
- 「**どうやって？**」に答える → 現在分詞だけ

## 2-2. 黒板に書いてあったこと

**① 練習帳④の質問**
> *¿Qué tenéis en común con estas tres personas?*
> この3人と、あなたたちはどんなところが同じですか？

- *tener en común* ＝ 共通点がある
- *tenéis* は *vosotros*（あなたたち）の形です。

**② ていねいなメールの書き出し**
> *Estimados Sres. del Instituto de Idiomas «Caligrama»:*
> 語学学校「カリグラマ」の皆さまへ

- ***Estimados Sres.*** ＝ *Estimados señores*（拝啓、〜の皆さま）。*Sres.* は *señores* の略です。
- 最後は **コロン（:）** で終わります。日本語の「、」ではありません。
- 練習帳④の Klaus や Sandra のメール（*Muy señores míos:*）と同じ使い方です。④の作文は、**この学校あてのメール**として書くのかもしれません（推測）。

**③ 動詞の3つの形（規則動詞）**

| 原形（infinitivo） | 現在分詞（gerundio） | 過去分詞（participio） |
|---|---|---|
| am**ar** | am**ando** | am**ado** |
| com**er** | com**iendo** | com**ido** |
| viv**ir** | viv**iendo** | viv**ido** |

- **現在分詞** → *estar* といっしょに「〜しているところ」、1つで「〜しながら」
- **過去分詞** → *haber* といっしょに現在完了（*he amado* ＝愛した）
- 見分け方：現在分詞には **n** が入る（-a**n**do / -ie**n**do）

## 3. 新しい単語・表現

### スペインの口語

| 表現 | 本当の意味 | メモ |
|---|---|---|
| **ser un zorro** | 頭がよくて、ずる賢い | *zorro* ＝キツネ。⚠ 女性形 *zorra* は悪口になるので使わない |
| **Nos van a dar las uvas.** | すごく時間がかかる | 大みそかに12粒のブドウを食べる時間まで終わらない、という意味 |
| **hacerse la víctima** | 被害者ぶる | *víctima* ＝被害者 |
| **tener mala leche** | 意地が悪い、すぐ怒る | ＝ *una persona que está siempre de mal humor* |
| **echar una mano** | 手伝う | ＝ *ayudar*。*¿Me echas una mano?*（手伝ってくれる？） |

### dejar de ＋ 原形 ＝ 〜するのをやめる

> *Dejé de fumar en 2018.*（2018年にたばこをやめた）→ ***Ya no** fumo.*（もう吸っていない）

**ya no ＝ もう〜ない**とセットで覚えると便利です。

⚠ ノートの例文 *Dejó de vivir en Buenos Aires y **me** vine a vivir a Barcelona.* は、主語をそろえます。
- 「私」：*Dej**é** de vivir en Buenos Aires y **me vine** a vivir a Barcelona.*
- 「彼・彼女」：*Dej**ó** de vivir en Buenos Aires y **se vino** a vivir a Barcelona.*

### 1課のプリントの単語

| スペイン語 | 日本語 |
|---|---|
| ¿A qué se dedica? | お仕事は何をしていますか？ |
| describirse | 自分のことを説明する |
| el defecto / la cualidad | 短所／長所 |
| apreciar | 大切に思う、高く評価する |
| emocionar | 感動させる（*Me emociona...* ＝〜に感動する） |
| una asignatura pendiente | まだやっていない（心残りの）こと。もとは「単位を落とした科目」 |
| actualmente | **今、現在**（⚠「実際に」ではない） |
| caer bien / mal | 感じがいい／悪いと思う（*Me cae bien.* ＝あの人、好き） |
| rodar | （映画を）撮影する |
| el / la protagonista | 主人公 |
| una obra de teatro | 演劇 |
| protagonizado/a por | 〜が主演の |
| regalar | プレゼントする |
| escoger | 選ぶ |
| salir de fiesta | 夜遊びに行く |

### 性格の形容詞（Ficha 3）

| スペイン語 | 日本語 | スペイン語 | 日本語 |
|---|---|---|---|
| tacaño/a | けち | generoso/a | 気前がいい |
| optimista | 前向き | trabajador/a | 働き者 |
| gracioso/a | おもしろい | creativo/a | 創造的 |
| idealista | 理想主義 | sincero/a | 正直 |
| serio/a | まじめ、かたい | aburrido/a | つまらない |
| deportista | スポーツ好き | simpático/a | 感じがいい |

*optimista, idealista, deportista* は、男性も女性も同じ形です。

## 4. 文法のポイント：過去未来（condicional）＝「〜するだろう」「〜したい」

1課の大事な文法です。Ficha 5・6 の質問は、全部この形です。

### 作り方：原形 ＋ -ía

| | hablar | comer | vivir |
|---|---|---|---|
| yo | hablar**ía** | comer**ía** | vivir**ía** |
| tú | hablar**ías** | comer**ías** | vivir**ías** |
| él / ella / usted | hablar**ía** | comer**ía** | vivir**ía** |
| nosotros | hablar**íamos** | comer**íamos** | vivir**íamos** |
| vosotros | hablar**íais** | comer**íais** | vivir**íais** |
| ellos / ustedes | hablar**ían** | comer**ían** | vivir**ían** |

- -ar / -er / -ir 全部**同じ語尾**です。いつも **í** にアクセント記号がつきます。
- 線過去の *-er / -ir* の語尾（*comía*）と似ていますが、過去未来は**原形のあと**につけます（*comer**ía***）。

### 不規則な形（プリントに出てきたもの）

| 原形 | 過去未来 | 原形 | 過去未来 |
|---|---|---|---|
| hacer | **haría** | salir | **saldría** |
| decir | **diría** | tener | **tendría** |
| poder | **podría** | poner | **pondría** |
| querer | **querría** | venir | **vendría** |
| saber | **sabría** | haber | **habría** |

### 使い方

1. **想像**（もし〜だったら）：*Imagina que eres músico. ¿Qué instrumento **tocarías**?*（ミュージシャンだったら、何の楽器をひく？）
2. **ていねいな希望**：*Me **gustaría** trabajar con Penélope Cruz.*（ペネロペ・クルスと仕事がしたいな）
3. **ていねいなお願い**：*¿**Podrías** repetirlo?*（もう一度言ってもらえますか？）

### Ficha 5 の答え方の例（[ ] を自分のことに）

> *Si fuera directora de cine, **haría** [comedias románticas].*（映画監督だったら、[ラブコメ]を作る）
> *Me **gustaría** cocinar [sushi] para [mi familia].*（[家族]のために[すし]を作りたい）
> *Como escritora, **escribiría** [novelas de misterio] y el libro **acabaría** [bien].*（作家なら[ミステリー]を書いて、本は[ハッピーエンド]にする）

⚠ Ficha 6 の *si no **fuese** actriz*（もし女優でなかったら）の *fuese* は「接続法過去」という、もっと先で習う形です。今は「もし〜だったら」の決まった言い方として覚えておけば大丈夫です。

## 5. 練習帳の答え合わせ（私の答え）

### ⑤⑥ ✅ よくできました

前に直したところ（*esquiando*, *hablando*, *ningún curso*, *en el diccionario*）も、全部正しく書けています。

### ⑦ 🔺 ほぼ正解

> 私の答え：*Cuando era joven, iba a escuela sin desayunar.*
> ○ *Cuando era joven, iba **a la** escuela sin desayunar.*（若いころ、朝ごはんを食べないで学校に行っていた）

- **線過去（*era*, *iba*）で昔の習慣**を言えていて、**sin ＋ 原形**も正しいです。すばらしい！
- 「学校に行く」は ***ir a la escuela***（冠詞の *la* が必要）。

### ⑧ 🔺 もう一度聞いてみよう（答えは「練習帳0課の答え」のPDFで確認）

| 番号 | 私の答え | 直すところ |
|---|---|---|
| 1 | le cuesta hablar con fu… | ***hablar con fluidez***（すらすら話す）。最後まで書く |
| 2 | le cuesta pronunciación ar | ***la pronunciación***（発音）。名詞なので *la* をつける |
| 2 | no le **salen** | ✅ 正解 |
| 2 | Le parece **interesante** | ✅ 正解 |
| 3 | le cuesta pronunciación r | ***pronunciar*** bien（動詞の原形） |
| 3 | Le cuestan **poco** | ***las eses***（s の音）。*cuestan* が複数なので、後ろは複数の名詞 |

**ヒント**：*le cuesta* のあとは、**動詞の原形**（*hablar*, *pronunciar*）か、**冠詞＋名詞**（*la pronunciación*）です。

### ⑨⑩ まだ空いています

⑨は *Lo más útil **ha sido**...*、⑩は意見に印をつける問題です（10月23日のノートにやり方があります）。

## 6. 練習問題（過去未来）

（　）の動詞を過去未来にしてください。

1. Si fuera rica, (yo, viajar) ______ por todo el mundo.
2. ¿Qué (tú, hacer) ______ con un millón de euros?
3. Me (gustar) ______ aprender a tocar la guitarra.
4. ¿(Tú, poder) ______ ayudarme, por favor?
5. Claudia (salir) ______ de fiesta todos los días.
6. Nosotros (vivir) ______ en una isla.

## 答えと解説

1. **viajaría** … 原形 *viajar* ＋ *-ía*
2. **harías** … *hacer* は不規則で *har-*
3. **gustaría** … ていねいな希望。*gustar* の形（*me gustaría*）
4. **Podrías** … *poder* は不規則で *podr-*。ていねいなお願い
5. **saldría** … *salir* は不規則で *saldr-*
6. **viviríamos** … *nosotros* の語尾は *-íamos*

## 7. 先生に聞くとよいこと

- プリント（Ficha de trabajo）は宿題ですか？
  - *¿Las fichas de trabajo son deberes?*
- 動画はどこで見られますか？
  - *¿Dónde podemos ver el vídeo de Claudia?*

## 8. 自信がない部分（推測）

- 授業でどこまで進んだか、プリントが宿題かどうかは、写真から考えた**推測**です。
- ⑧の答えは、聞き取りの音声を私は聞けないので、「練習帳0課の答え」のPDFで確認しました。
- 動画の内容（Claudia について）は、私は見られないので、Ficha 3 の答えは書いていません。

<script type="text/markdown" id="md-n20261027-5" data-note="1" data-date="2026-10-27（火）" data-title="tener と hay のちがい" data-file="復習ノート/2026-10-27_tener と hay のちがい.md">
# 2026-10-27（火）｜tener と hay のちがい

## 1. いちばん大事なちがい

> - **tener** ＝ （人や物が）**〜を持っている**　→ 「**だれが**持っているか」を言う
> - **hay** ＝ （ある場所に）**〜がある・いる**　→ 「**そこに存在する**こと」だけを言う

| | tener | hay |
|---|---|---|
| 意味 | 〜を持っている | 〜がある、〜がいる |
| 主語 | ある（*yo, tú, mi casa*…） | **ない**（だれが、とは言わない） |
| 形 | 主語に合わせて変わる（*tengo, tienes, tiene*…） | **いつも *hay***（単数でも複数でも同じ） |
| 例 | *Tengo dos hermanos.*（兄弟が2人いる） | *Hay dos bancos en mi calle.*（私の通りには銀行が2つある） |

## 2. 日本語の「ある・いる」に気をつけて

日本語では「**ある・いる**」と言うのに、スペイン語では ***tener*** を使うことがよくあります。**「だれの？」があれば tener** です。

| 日本語 | スペイン語 | ポイント |
|---|---|---|
| 私には兄弟が2人**いる** | ***Tengo*** *dos hermanos.* | 私の兄弟 → tener |
| 今日は時間が**ある** | ***Tengo*** *tiempo hoy.* | 私の時間 → tener |
| 質問が1つ**ある**んですが | ***Tengo*** *una pregunta.* | 私の質問 → tener（授業で使える！） |
| 近くに薬局は**ある**？ | ***¿Hay*** *una farmacia cerca?* | だれのものでもない → hay |
| 教室に学生が10人**いる** | ***Hay*** *diez estudiantes en la clase.* | そこに存在する → hay |

## 3. hay の形は変わらない

| 単数 | 複数 |
|---|---|
| *Hay **un** problema.*（問題が1つある） | *Hay **muchos** problemas.*（問題がたくさんある） |

- × ~~Hayn muchos problemas.~~　→ ○ ***Hay*** *muchos problemas.*
- *hay* は動詞 ***haber*** の特別な形です。

**時制が変わると**

| 時制 | 形 | 例 |
|---|---|---|
| 現在 | **hay** | *Hay mucha gente.*（人がたくさんいる） |
| 線過去 | **había** | *Antes había un cine aquí.*（前はここに映画館があった） |
| 点過去 | **hubo** | *Ayer hubo un accidente.*（昨日、事故があった） |
| 現在完了 | **ha habido** | *Hoy ha habido mucho tráfico.*（今日は渋滞がひどかった） |

過去でも、**複数なのに *habían* にはしません**（× ~~habían muchas personas~~ → ○ *había muchas personas*）。

## 4. hay と estar のちがい（まちがえやすい！）

「〜がある」には、もう1つ ***estar*** もあります。

| | hay | estar |
|---|---|---|
| 使うとき | **はじめて話に出てくるもの**（どれか決まっていない） | **どれか決まっているもの**（相手も知っている） |
| 名詞の前 | *un, una*、数字、*mucho*、冠詞なし | ***el, la***、*mi, tu*、名前 |
| 例 | *Hay **un** supermercado cerca.*（近くにスーパーがある） | ***El*** *supermercado **está** cerca.*（そのスーパーは近くにある） |

- × ~~Hay el libro en la mesa.~~ → ○ ***El*** *libro **está** en la mesa.*（その本は机の上にある）
- ○ *Hay **un** libro en la mesa.*（机の上に本が1冊ある）

**覚え方**：***hay* のあとに *el / la* は来ない**。

## 5. 物も tener を使える

「家」や「町」のような物も、*tener* の主語になれます。

> ***Mi casa tiene*** *dos baños.*（私の家にはお風呂が2つある）＝ ***En mi casa hay*** *dos baños.*

どちらも正しいです。ただし、主語がないのに *tiene* を使うのはまちがいです。
- × ~~En mi casa tiene dos baños.~~（「だれが」持っているのかわからない）

## 6. セットで覚える：tener que と hay que

| 形 | 意味 | 例 |
|---|---|---|
| **tener que** ＋ 原形 | （**だれか**が）〜しなければならない | *Tengo que estudiar.*（私は勉強しなければならない） |
| **hay que** ＋ 原形 | （**一般に、みんな**）〜しなければならない | *Hay que estudiar mucho para el examen.*（試験のためには、たくさん勉強しないといけない） |

これも同じルールです。**「だれが？」がはっきりしていれば tener、みんなに当てはまることなら hay**。

## 7. tener を使う決まった表現

日本語では「ある・いる」でも「〜だ」でもないのに、*tener* を使う表現です。

| スペイン語 | 意味 |
|---|---|
| tener hambre / sed | おなかがすいている／のどがかわいている |
| tener frío / calor | 寒い／暑い（体が） |
| tener sueño | 眠い |
| tener ... años | 〜歳だ（*Tengo 30 años.*） |
| tener razón | 正しい（*Tienes razón.* ＝その通り） |

⚠ 天気の「寒い・暑い」は ***hace*** を使います：*Hoy **hace** frío.*（今日は寒い）。体で感じる寒さは ***tengo*** *frío*。

## 8. 練習問題

（　）に **tener の正しい形 / hay / está** のどれかを入れてください。

1. Yo (　) dos hijos.
2. En mi barrio (　) muchos restaurantes.
3. ¿(　) un cajero automático por aquí?
4. La farmacia (　) al lado del banco.
5. Mi profesora (　) mucha paciencia.
6. Ayer (　) una fiesta en la escuela.（過去の形に）
7. Para aprender un idioma, (　) que practicar todos los días.
8. まちがいを直してください：*Hay el mercado en la plaza.*

## 答えと解説

1. **tengo** … 「私の」子ども → *tener*。*yo* の形は *tengo*
2. **hay** … そこに存在する。*muchos* のあとが複数でも *hay* のまま
3. **Hay** … 「近くにATMはある？」。決まっていない ATM（*un*）なので *hay*
4. **está** … *la farmacia*（その薬局）は決まっているもの → *estar*
5. **tiene** … 「先生が」持っている忍耐 → *tener*（*ella* の形 *tiene*）
6. **hubo** … 1回のできごと（パーティー）なので点過去の *hubo*
7. **hay** … みんなに当てはまること → *hay que* ＋ 原形
8. ***El mercado está en la plaza.*** … *el mercado*（決まっている市場）なので *estar*。「広場に市場が1つある」なら *Hay un mercado en la plaza.*

# 2026-10-27（火）｜復習「¿Por qué? と ¿Para qué?」

> 0課「Gente en clase」で習った **por / porque / para** のおさらいです。

## 1. いちばん大事なちがい

| 質問 | 意味 | 聞いていること | 答え方 |
|---|---|---|---|
| **¿Por qué?** | **なぜ？** | 理由・原因（**うしろ**をふり返る） | ***porque*** ＋ 文／***por*** ＋ 名詞 |
| **¿Para qué?** | **何のために？** | 目的・ゴール（**前**を見る） | ***para*** ＋ 動詞の原形／名詞 |

**覚え方**
- ***por qué*** → 「〜**だから**」（理由）
- ***para qué*** → 「〜**するために**」（目的）

## 2. 同じ場面でくらべる

**¿Por qué estudias español?**（**なぜ**スペイン語を勉強しているの？）
> ***Porque*** *vivo en España.*（スペインに住んでいる**から**）
> ***Por*** *mi trabajo.*（仕事が理由で）

**¿Para qué estudias español?**（**何のために**スペイン語を勉強しているの？）
> ***Para*** *hablar con mis vecinos.*（近所の人と話す**ために**）
> ***Para*** *mis estudios.*（勉強の**ために**）

## 3. つづりに注意：4つの「ポルケ」

| つづり | 意味 | 例 |
|---|---|---|
| **¿Por qué...?** | なぜ？（質問。**2語**で、é にアクセント記号） | *¿Por qué no vienes?* |
| **porque** | 〜だから（答え。**1語**で、アクセント記号なし） | *Porque estoy cansada.* |
| **por** | 〜が理由で（後ろに名詞） | *Por mi trabajo.* |
| **¿Para qué...?** | 何のために？（é にアクセント記号） | *¿Para qué sirve esto?*（これは何に使うの？） |

⚠ アクセント記号のない ***para que***（〜するように）は、あとで習う別の表現です。後ろに接続法がきます（例：*Te lo explico **para que** lo entiendas.* ＝あなたがわかるように説明するね）。教科書では7課あたりで出てきます。

## 4. 私の練習（10月27日）

| 質問 | 私の答え | 直した文 |
|---|---|---|
| ¿Por qué vives en España? | Porque mi marido es el español. | ***Porque mi marido es español.***（夫がスペイン人だからです） |
| ¿Para qué usas el móvil? | Para aprender el español. | ***Para aprender español.***（スペイン語を学ぶためです） |

✅ **porque と para の使い分けは、2つとも完璧でした！**

### 直したところ：冠詞の *el*

| 場面 | ルール | 例 |
|---|---|---|
| *ser* ＋ 国籍 | ***el* をつけない**・小文字 | ○ *Es español.*　○ *Soy japonesa.* |
| *aprender / hablar / estudiar* ＋ 言語 | ふつうは ***el* をつけない** | ○ *Aprendo español.*　○ *Hablo japonés.* |
| 言語が主語 | ***el* をつける** | ○ ***El*** *español es difícil.* |

*es el español* だと「スペイン語です」か「（特定の）そのスペイン人です」という意味になってしまいます。

**チェックポイント**：名詞の前に *el / la* が必要かどうか（*comida japonesa*、*en el diccionario* のときと同じです）。

## 5. 練習問題

（　）に **porque / por / para** のどれかを入れてください。

1. —¿Por qué estudias español? —(　) vivo en Tenerife.
2. —¿Para qué ahorras dinero? —(　) viajar a Japón.
3. No vine a clase (　) el trabajo.
4. Uso el diccionario (　) entender las palabras nuevas.
5. Estoy contenta (　) hoy he entendido a la profesora.
6. 正しいつづりはどっち？ ¿(Porque / Por qué) no hablas más en clase?

## 答えと解説

1. **Porque** … 後ろに文（*vivo en Tenerife*）があるので *porque*
2. **Para** … 「何のため？」と聞かれているので目的。後ろが原形（*viajar*）
3. **por** … 後ろが名詞（*el trabajo*）で、理由をあらわしている（仕事のせいで来られなかった）
4. **para** … 「理解するために」＝目的。後ろが原形（*entender*）
5. **porque** … 後ろに文（*hoy he entendido...*）があり、理由をあらわしている
6. **Por qué** … 質問なので、**2語**で é にアクセント記号

# 授業の復習ノートの使い方

## 流れ

1. 授業のあと、下の「**貼りつけ用メモ**」をコピーして、わかる部分だけうめる。
2. チャットに貼って「**復習ノートにして**」と送る。
3. Claude が「**ノートの形式**」でファイルを作り、このフォルダに保存する。
   - ファイル名：`2026-10-08_線過去と点過去.md` のように「日付_テーマ」

**全部うめなくて大丈夫です。** 黒板の写真の文字、聞こえた単語だけ、プリントの一部だけでもOKです。

---

## 貼りつけ用メモ（これをコピーして使う）

```
【日付】
【今日のテーマ（わかれば）】
【黒板に書いてあったこと】

【プリント・教科書のページ（わかれば）】

【聞こえたけど意味がわからなかった言葉】

【先生が何度も言っていた言葉】

【宿題（わかれば）】

【わからなかったこと・聞きたいこと】

```

---

## ノートの形式（Claude が作るもの）

```
# 日付｜テーマ

## 1. 今日の授業のまとめ（日本語で3行）
## 2. 新しい単語・表現（表：スペイン語／日本語／例文）
## 3. 文法のポイント（やさしい日本語で説明＋例文）
## 4. 次の授業で使える表現（3つ）
## 5. 練習問題（5問）
## 6. 答えと解説
## 7. 先生に聞くとよいこと（スペイン語の質問文つき）
## 8. 自信がない部分（推測した部分）
```

### 形式のルール

- 説明は日本語、例文はスペイン語（日本語訳つき）。
- メモから**読み取れなかった部分は「推測」と書く**。
- 「8. 自信がない部分」には、Claude の説明が先生とちがうかもしれない点を書く。→ 次の授業で先生に確認してください。
- 宿題が書いてあれば、ノートの一番上に「宿題」としてのせる。

テンプレートは [テンプレート.md](テンプレート.md) にあります。

    if (chip) d.appendChild(el('span', 'chip', chip));
    if (s.textContent.indexOf('⭐') !== -1) d.appendChild(el('span', 'chip key', '⭐ 大事'));
    b.appendChild(d); b.appendChild(el('span', 'note-title', s.dataset.title));
    b.addEventListener('click', function () { show(s.id.slice(3)); });
    return b;
  }
  // 復習ノートの一覧（古い順）。いちばん新しいノートに「最新」をつける
  function renderList() {
    doc.innerHTML = '';
    doc.appendChild(el('h1', null, '復習ノート'));
    doc.appendChild(el('p', 'list-note', '授業ごとのノートです。日付の古い順に並んでいます。タップすると開きます。'));
    var dated = notes.filter(function (s) { return s.id !== 'md-howto'; });
    var ol = el('ol', 'note-list');
    dated.forEach(function (s, i) {
      var li = el('li'); li.appendChild(noteButton(s, i === dated.length - 1 ? '最新' : null)); ol.appendChild(li);
    });
    if (!dated.length) doc.appendChild(el('p', 'list-note', 'まだノートはありません。授業のメモや写真を送ると、ここに増えていきます。'));
    else doc.appendChild(ol);
    var howto = document.getElementById('md-howto');
    if (howto) {
      doc.appendChild(el('h2', null, 'ノートの作り方'));
      var ul = el('ul', 'note-list'), li = el('li');
      li.appendChild(noteButton(howto)); ul.appendChild(li); doc.appendChild(ul);
    }
  }
  // ノートの上に「一覧にもどる」、下に「前／次のノート」
  function noteBars(src) {
    var top = el('div', 'note-bar');
    var back = el('button', 'link-btn', '← ノート一覧にもどる'); back.type = 'button';
    back.addEventListener('click', function () { show('fukushu'); });
    top.appendChild(back);
    doc.insertBefore(top, doc.firstChild);
    var i = notes.indexOf(src), bottom = el('div', 'note-bar bottom');
    [[notes[i - 1], '← '], [notes[i + 1], '']].forEach(function (p, k) {
      var s = p[0];
      if (!s) { bottom.appendChild(el('span')); return; }
      var b = el('button', 'link-btn', k === 0 ? '← ' + s.dataset.date : s.dataset.date + ' →'); b.type = 'button';
      b.addEventListener('click', function () { show(s.id.slice(3)); });
      bottom.appendChild(b);
    });
    doc.appendChild(bottom);
  }

  function render(id) {
    var src = document.getElementById('md-' + id) || tabSources[0];
    id = src.id.slice(3);
    var tabId = src.dataset.note ? 'fukushu' : id;
    if (src.dataset.list) { renderList(); markTab(tabId); return id; }
    var md = src.textContent;
    doc.innerHTML = window.marked ? marked.parse(md) : '<pre></pre>';
    if (!window.marked) doc.firstChild.textContent = md;

    // ⭐ で始まる見出しと引用は「大事なところ」として目立たせる
    doc.querySelectorAll('h2, blockquote').forEach(function (e) {
      var t = e.textContent.trim();
      if (e.tagName === 'H2' ? t.indexOf('⭐') !== -1 : t.indexOf('⭐') === 0) e.classList.add('key');
    });
    // wide tables scroll inside their own box
    doc.querySelectorAll('table').forEach(function (t) {
      var w = document.createElement('div'); w.className = 'table-wrap';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    // answers stay folded until tapped
    doc.querySelectorAll('h2').forEach(function (h) {
      if (h.textContent.indexOf('答えと解説') === -1) return;
      var d = document.createElement('details'), s = document.createElement('summary');
      s.textContent = h.textContent + '（タップで開く）';
      h.parentNode.insertBefore(d, h); d.appendChild(s);
      var n = h;
      while (n && !(n !== h && (n.tagName === 'H2' || n.tagName === 'H1'))) { var next = n.nextSibling; d.appendChild(n); n = next; }
    });
    // links between notes switch tabs
    doc.querySelectorAll('a[href]').forEach(function (a) {
      var href = decodeURIComponent(a.getAttribute('href'));
      if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      var hit = sources.filter(function (s) { return href.indexOf(s.dataset.file) !== -1; })[0];
      a.addEventListener('click', function (e) { e.preventDefault(); if (hit) show(hit.id.slice(3)); });
      if (!hit) a.removeAttribute('href');
    });
    doc.querySelectorAll('input[type="checkbox"]').forEach(function (c, i) {
      c.disabled = false; c.id = 'chk-' + id + '-' + i;
      try { c.checked = localStorage.getItem(c.id) === '1'; } catch (e) {}
      c.addEventListener('change', function () { try { localStorage.setItem(c.id, c.checked ? '1' : '0'); } catch (e) {} });
    });
    if (src.dataset.note) noteBars(src);
    markTab(tabId);
    return id;
  }
  function markTab(tabId) {
    nav.querySelectorAll('button').forEach(function (b) {
      var on = b.dataset.id === tabId;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center' });
    });
  }
  function show(id) {
    id = render(id);
    window.scrollTo(0, 0);
    try { localStorage.setItem(KEY, id); } catch (e) {}
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  tabSources.forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = s.id.slice(3); b.textContent = s.dataset.label;
    b.addEventListener('click', function () { show(b.dataset.id); });
    nav.appendChild(b);
  });
  var start = location.hash.slice(1);
  if (!start) { try { start = localStorage.getItem(KEY); } catch (e) {} }
  render(start || '');
})();
</script>

</body>
</html>
